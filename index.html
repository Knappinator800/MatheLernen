    inp.oninput = () => { if (!inp.value.trim()) { pv.innerHTML = ''; return; } try { pv.innerHTML = '= ' + tex(ExprParser.toTeX(ExprParser.parse(inp.value, [f.v]))); } catch (e) { pv.textContent = '…'; } };
  });
  root.querySelectorAll('input').forEach((inp, k, all) => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (all[k + 1]) all[k + 1].focus(); else { inp.blur(); const b = root.querySelector('#chk, #tnext'); b && b.click(); } } }));
}

/* ------------------------------------------------ Test */
const TestState = { cfg: null, items: [], idx: 0 };
/* Laufenden Test im Browser speichern, damit er nach dem Schließen der App weitergeht.
   Term-Aufgaben (Funktion zum Prüfen) werden als Wertetabelle gespeichert. */
const EXPR_PTS = [0.37, 0.81, 1.23, 1.67, 2.11, 2.53, 3.07, -0.6, -1.3];
function serTask(t) {
  return Object.assign({}, t, { fields: t.fields.map(f => f.type !== 'expr' ? f : Object.assign({}, f, { fn: undefined, vals: EXPR_PTS.map(x => { const y = f.fn(x); return isFinite(y) ? y : null; }) })) });
}
function deserTask(t) {
  t.fields.forEach(f => { if (f.type === 'expr' && f.vals) { const v = f.vals; f.fn = x => { const i = EXPR_PTS.indexOf(x); return i < 0 || v[i] == null ? NaN : v[i]; }; } });
  return t;
}
function elapsedMs() { return (TestState.elapsed || 0) + (Date.now() - (TestState.resumeAt || Date.now())); }
function saveTest() {
  if (!TestState.items.length || TestState.items[0].res) return;
  Store.d.activeTest = { items: TestState.items.map(it => ({ task: serTask(it.task), ans: it.ans })), idx: TestState.idx, elapsed: elapsedMs(), saved: Date.now() };
  Store.save();
}
function restoreTest() {
  const a = Store.d.activeTest; if (!a || !a.items) return false;
  try {
    TestState.items = a.items.map(it => ({ task: deserTask(it.task), ans: it.ans, res: null }));
    TestState.idx = Math.min(a.idx || 0, TestState.items.length - 1); TestState.elapsed = a.elapsed || 0; TestState.resumeAt = Date.now();
    return true;
  } catch (e) { delete Store.d.activeTest; Store.save(); return false; }
}
function discardTest() { delete Store.d.activeTest; Store.save(); TestState.items = []; }
function viewTestSetup(q) {
  const pre = q.ch ? [+q.ch] : [1, 2, 3];
  const cfg = TestState.cfg = TestState.cfg && !q.ch ? TestState.cfg : { ch: pre, topics: TOPICS.filter(t => pre.includes(t.ch)).map(t => t.id), n: 10, mc: true };
  return `<div class="kt">` + header('Test', '#/') + `
  <div class="hero"><h2>Test zusammenstellen</h2><p>Aufgaben aus mehreren Bereichen gemischt – Auswertung am Ende.</p></div>
  <div class="glass sect"><h4>Bereiche</h4><div class="chips">${CHAPTERS.map(c => `<button class="tog ${c.cls} ${cfg.ch.includes(c.id) ? 'on' : ''}" data-tch="${c.id}">${c.short}</button>`).join('')}</div></div>
  <div class="glass sect"><h4>Unterthemen</h4><div class="chips">${TOPICS.filter(t => cfg.ch.includes(t.ch)).map(t => `<button class="tog ${chapterOf(t.ch).cls} ${cfg.topics.includes(t.id) ? 'on' : ''}" data-ttop="${t.id}">${t.nr} ${esc(t.title)}</button>`).join('')}</div></div>
  <div class="glass sect"><h4>Anzahl Aufgaben</h4><div class="chips">${[5, 10, 15, 20].map(n => `<button class="tog ${cfg.n === n ? 'on' : ''}" data-tn="${n}">${n}</button>`).join('')}</div>
  <h4 style="margin-top:14px">Aufgabenarten</h4><div class="chips"><button class="tog ${cfg.mc ? 'on' : ''}" data-tmc="1">inkl. Verständnisfragen (MC)</button></div></div>
  ${Store.d.activeTest ? `<p class="small muted" style="margin-top:12px">Hinweis: Ein neuer Test ersetzt deinen angefangenen Test. <a href="#/test/run" style="color:var(--acc)">Angefangenen Test fortsetzen</a></p>` : ''}
  <div class="actions"><button class="btn pri grow" id="tstart" ${cfg.topics.length ? '' : 'disabled'}>${ICONS.test} Test starten</button></div></div>`;
}
function mountTestSetup() {
  const cfg = TestState.cfg;
  $app.querySelectorAll('[data-tch]').forEach(b => b.onclick = () => {
    const id = +b.dataset.tch; const on = cfg.ch.includes(id);
    if (on) { cfg.ch = cfg.ch.filter(x => x !== id); cfg.topics = cfg.topics.filter(t => topicOf(t).ch !== id); }
    else { cfg.ch.push(id); cfg.topics.push(...TOPICS.filter(t => t.ch === id).map(t => t.id)); }
    render();
  });
  $app.querySelectorAll('[data-ttop]').forEach(b => b.onclick = () => { const id = b.dataset.ttop; cfg.topics = cfg.topics.includes(id) ? cfg.topics.filter(x => x !== id) : cfg.topics.concat(id); render(); });
  $app.querySelectorAll('[data-tn]').forEach(b => b.onclick = () => { cfg.n = +b.dataset.tn; render(); });
  $app.querySelectorAll('[data-tmc]').forEach(b => b.onclick = () => { cfg.mc = !cfg.mc; render(); });

}
function startTest() {
  const cfg = TestState.cfg;
  let pool = GENS.filter(g => cfg.topics.includes(g.topic) && (cfg.mc || !g.mcq));
  if (!pool.length) pool = GENS.filter(g => cfg.topics.includes(g.topic));
  /* möglichst gleichmäßig über Unterthemen verteilen */
  const byT = {}; pool.forEach(g => (byT[g.topic] = byT[g.topic] || []).push(g));
  const tids = shuffle(Object.keys(byT)), items = [];
  const used = new Set(); let k = 0;
  while (items.length < cfg.n) {
    const tid = tids[k % tids.length], fresh = byT[tid].filter(g => !used.has(g.id) || g.mcq);
    const g = pick(fresh.length ? fresh : byT[tid]); used.add(g.id); items.push(newTask(g)); k++;
  }
  TestState.items = shuffle(items).map(t => ({ task: t, ans: null, res: null }));

}
function viewTestRun() {

  const i = TestState.idx, N = TestState.items.length, it = TestState.items[i];
  const last = i === N - 1;
  return `<div class="kt">` + header(`Test · ${i + 1}/${N}`, '#/test') + `<div class="prog"><i style="width:${(i) / N * 100}%"></i></div><div style="height:14px"></div>
  <div class="${chapterOf(topicOf(GEN_BY_ID[it.task.gid].topic).ch).cls}" id="tbox">${taskHTML(it.task, { showTopic: true, actions: `${i > 0 ? `<button class="btn" id="tprev">${ICONS.back}</button>` : ''}<button class="btn pri grow" id="tnext">${last ? 'Abgeben & auswerten' : 'Weiter'} ${ICONS.next}</button>` })}</div></div>`;
}
function mountTestRun() {
  const box = document.getElementById('tbox'); if (!box) return;
  const it = TestState.items[TestState.idx];
  wireTask(box, it.task);
  if (it.ans) it.task.fields.forEach((f, i) => { const a = it.ans[i]; if (f.type === 'mc') { if (a != null) box.querySelector(`[data-mc="${i}:${a}"]`).classList.add('sel'); } else box.querySelector('#in' + i).value = a || ''; });
  const save = () => { it.ans = readAnswers(it.task, box); saveTest(); };
  box.addEventListener('input', save); box.addEventListener('click', e => { if (e.target.closest('[data-mc]')) setTimeout(save, 0); });
  const p = document.getElementById('tprev'); if (p) p.onclick = () => { save(); TestState.idx--; saveTest(); render(); };

    save();

    else finishTest();
  };
}
function finishTest() {
  let pts = 0;
  TestState.items.forEach(it => {
    it.res = it.task.fields.map((f, i) => grade(f, it.ans ? it.ans[i] : null));
    const ok = it.res.every(r => r.st !== 'bad'); Store.rec(it.task.gid, ok);
    pts += it.res.filter(r => r.st !== 'bad').length / it.res.length;
  });
  const score = pts / TestState.items.length;
  Store.d.tests.push({ date: Date.now(), score, n: TestState.items.length, mins: Math.round(elapsedMs() / 60000) }); delete Store.d.activeTest; Store.d.tests = Store.d.tests.slice(-30); Store.save();
  TestState.score = score; location.hash = '#/test/result';
}
function viewTestResult() {
  if (!TestState.items.length || !TestState.items[0].res) return viewTestSetup({});
  const its = TestState.items;
  const byTopic = {};
  its.forEach(it => { const tid = GEN_BY_ID[it.task.gid].topic; const b = byTopic[tid] = byTopic[tid] || { n: 0, p: 0 }; b.n++; b.p += it.res.filter(r => r.st !== 'bad').length / it.res.length; });
  const weak = Object.entries(byTopic).filter(([, b]) => b.p / b.n < 0.6).map(([t]) => topicOf(t));
  return `<div class="kt">` + header('Auswertung', '#/') + `
  <div class="glass sect" style="text-align:center"><div class="score">${Math.round(TestState.score * 100)} %</div>
  <div class="muted">${its.filter(it => it.res.every(r => r.st !== 'bad')).length} von ${its.length} Aufgaben vollständig richtig · ${Store.d.tests.slice(-1)[0].mins} min</div></div>
  ${weak.length ? `<div class="glass sect"><h4>Wiederholen</h4><div class="chips">${weak.map(t => `<button class="tog on ${chapterOf(t.ch).cls}" data-go="#/t/${t.id}">${t.nr} ${esc(t.title)}</button>`).join('')}</div></div>` : ''}
  <div class="list" style="margin-top:14px">${its.map((it, k) => {

    return `<div class="glass res ${chapterOf(topicOf(g.topic).ch).cls}"><details><summary class="head" style="list-style:none"><span class="dot ${st}"></span><span class="sp"><b>${k + 1}. ${esc(g.title)}</b><br><span class="small muted">${topicOf(g.topic).nr} ${esc(topicOf(g.topic).title)}</span></span>${ICONS.next.replace('<svg', '<svg style="width:18px;color:var(--muted)"')}</summary>
      <div style="margin-top:10px" class="q">${it.task.q}</div>
      <div style="margin-top:8px">${it.task.fields.map((f, i) => `<div class="small" style="margin:4px 0"><span class="fb ${it.res[i].st}">${it.res[i].st === 'ok' ? '✓' : it.res[i].st === 'near' ? '≈' : '✗'}</span> ${f.label || 'Antwort'} deine Eingabe: <b>${f.type === 'mc' ? (it.ans && it.ans[i] != null ? f.opts[it.ans[i]] : '–') : esc((it.ans && it.ans[i]) || '–')}</b> · richtig: ${correctText(f)}</div>`).join('')}</div>

/* ------------------------------------------------ Kapitel 0: Lexikon */
const LexState = { q: '', cat: '', dir: 'term', cats: [], cur: null, shown: false, last: [] };
const lexBox = id => Store.d.lex[id] || 0;
function lexStats(list) { const b = [0, 0, 0, 0, 0, 0]; list.forEach(e => b[Math.min(lexBox(e.id), 5)]++); return b; }
function boxesHTML(list) {
  const b = lexStats(list), mx = Math.max(1, ...b);
  const lab = ['neu', 'Fach 1', 'Fach 2', 'Fach 3', 'Fach 4', 'sicher'];
  return `<div class="boxes">${b.map((v, i) => `<div style="height:${Math.max(6, v / mx * 100)}%;opacity:${0.35 + i * 0.13}" title="${lab[i]}"><span>${v}</span></div>`).join('')}</div>
  <div class="row small muted" style="margin-top:4px">${lab.map(l => `<span class="sp" style="text-align:center">${l}</span>`).join('')}</div>`;
}
function viewLex() {
  const learned = LEX.filter(e => lexBox(e.id) >= 4).length;
  return `<div class="k0">` + header('Grundlagen', '#/') + `
  <div class="hero"><h2>0.1 Lexikon</h2><p>${LEX.length} Begriffe & Formelzeichen · ${learned} sicher gelernt</p></div>
  <div class="glass sect" style="margin-top:0">${boxesHTML(LEX)}</div>
  <div class="actions" style="margin-top:14px"><button class="btn pri grow" data-go="#/lex/karten">${ICONS.book} Karteikarten</button><button class="btn grow" data-go="#/t/g-lex/ueben">${ICONS.check} Quiz</button></div>
  <div style="margin-top:18px"><input class="search" id="lexq" placeholder="Begriff suchen …" value="${esc(LexState.q)}" autocomplete="off"></div>
  <div class="chips" style="margin:12px 0">${[{ id: '', name: 'Alle' }].concat(LEX_CATS).map(c => `<button class="tog ${LexState.cat === c.id ? 'on' : ''}" data-lcat="${c.id}">${c.name}</button>`).join('')}</div>
  <div class="list" id="lexlist">${lexListHTML()}</div></div>`;
}
function lexFiltered() {
  const q = LexState.q.trim().toLowerCase();
  return LEX.filter(e => (!LexState.cat || e.cat === LexState.cat) && (!q || lexPlain(e.term).toLowerCase().includes(q) || e.def.toLowerCase().includes(q)));
}
/* Sortierschlüssel: TeX-Befehle entfernen, z. B. "\\(\\sigma_{xy}\\)" -> "sigmaxy" */
const lexKey = t => lexPlain(t).replace(/\\(text|bar|tilde|mathbb|operatorname)\b/g, '').replace(/\\/g, '').replace(/ℕ/g, 'N').replace(/ℝ/g, 'R').replace(/[^0-9A-Za-zÄÖÜäöüß]/g, '');
function lexListHTML() {
  const l = lexFiltered().slice().sort((a, b) => lexKey(a.term).localeCompare(lexKey(b.term), 'de', { sensitivity: 'base' }));
  if (!l.length) return '<div class="empty">Kein Begriff gefunden.</div>';
  const fach = b => b === 0 ? 'neu' : b >= 5 ? 'sicher' : 'Fach ' + b;
  let last = '';
  return l.map(e => {
    let L = lexKey(e.term).charAt(0).toUpperCase(); L = L.normalize('NFD').charAt(0); if (!/[A-Z]/.test(L)) L = '#';
    const head = L !== last ? `<div class="lexletter">${L}</div>` : ''; last = L;
    return head + `<details class="glass lexrow"><summary><b class="sp">${e.term}</b><span class="badge">${fach(lexBox(e.id))}</span></summary>
    <div class="def">${e.def}</div>${e.f ? `<div class="fm">\\[${e.f}\\]</div>` : ''}<div class="small muted">${lexCat(e.cat).name}</div></details>`;
  }).join('');
}
function mountLex() {
  const inp = document.getElementById('lexq');
  if (inp) inp.oninput = () => { LexState.q = inp.value; document.getElementById('lexlist').innerHTML = md(lexListHTML()); };
  $app.querySelectorAll('[data-lcat]').forEach(b => b.onclick = () => { LexState.cat = b.dataset.lcat; render(); });
}
/* Karteikarten (Leitner-System): gewusst -> ein Fach weiter, nicht gewusst -> zurück in Fach 1 */
function lexPool() { return LEX.filter(e => !LexState.cats.length || LexState.cats.includes(e.cat)); }
function lexPick() {
  let pool = lexPool(); const avoid = LexState.last.slice(-Math.min(6, pool.length - 1));
  const cand = pool.filter(e => !avoid.includes(e.id)); if (cand.length) pool = cand;
  const w = pool.map(e => { const b = lexBox(e.id); return b === 0 ? 3 : 1 / Math.pow(2, b - 1); });
  let x = Math.random() * sum(w); for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) return pool[i]; } return pool[0];
}
function viewLexCards() {
  if (!LexState.cur || !lexPool().includes(LexState.cur)) { LexState.cur = lexPick(); LexState.shown = false; }
  const e = LexState.cur, termFirst = LexState.dir === 'term';
  const front = termFirst ? `<div class="front">${e.term}</div>` : `<div style="font-size:17px">${e.def}</div>`;
  const back = termFirst ? `<div>${e.def}</div>${e.f ? `<div class="fm">\\[${e.f}\\]</div>` : ''}` : `<div class="front">${e.term}</div>${e.f ? `<div class="fm">\\[${e.f}\\]</div>` : ''}`;
  const b = lexBox(e.id);
  return `<div class="k0">` + header('Karteikarten', '#/k/0') + `
  <div class="glass sect" style="margin-top:14px">${boxesHTML(lexPool())}</div>
  <div class="chips" style="margin:14px 0 6px"><button class="tog ${termFirst ? 'on' : ''}" data-ldir="term">Begriff → Erklärung</button><button class="tog ${!termFirst ? 'on' : ''}" data-ldir="def">Erklärung → Begriff</button></div>
  <div class="chips" style="margin:8px 0 14px">${LEX_CATS.map(c => `<button class="tog ${LexState.cats.includes(c.id) ? 'on' : ''}" data-lcc="${c.id}">${c.name}</button>`).join('')}</div>
  <div class="glass flash" id="flash"><div class="small muted" style="margin-bottom:10px">${lexCat(e.cat).name} · ${b === 0 ? 'neu' : b >= 5 ? 'sicher' : 'Fach ' + b}</div>${front}
    ${LexState.shown ? `<div class="back">${back}</div>` : `<div class="hint2">Tippen zum Aufdecken</div>`}</div>
  <div class="actions">${LexState.shown ? `<button class="btn grow" id="lno" style="border-color:var(--bad)">✗ Nicht gewusst</button><button class="btn pri grow" id="lyes">✓ Gewusst</button>` : `<button class="btn pri grow" id="lshow">Aufdecken</button>`}</div>
  <p class="small muted" style="margin-top:14px">Gewusste Karten wandern ein Fach weiter und kommen seltener dran, nicht gewusste wieder zurück in Fach 1. Ab Fach 4 gilt ein Begriff als sicher gelernt.</p></div>`;
}
function mountLexCards() {
  const show = () => { LexState.shown = true; render(); };
  const f = document.getElementById('flash'); if (f && !LexState.shown) f.onclick = show;
  const s = document.getElementById('lshow'); if (s) s.onclick = show;
  const ans = ok => { const e = LexState.cur; Store.d.lex[e.id] = ok ? Math.min(lexBox(e.id) + 1, 5) : 1; Store.save(); LexState.last.push(e.id); LexState.cur = lexPick(); LexState.shown = false; render(); };
  const y = document.getElementById('lyes'); if (y) y.onclick = () => ans(true);
  const n = document.getElementById('lno'); if (n) n.onclick = () => ans(false);
  $app.querySelectorAll('[data-ldir]').forEach(b => b.onclick = () => { LexState.dir = b.dataset.ldir; LexState.shown = false; render(); });
  $app.querySelectorAll('[data-lcc]').forEach(b => b.onclick = () => { const id = b.dataset.lcc; LexState.cats = LexState.cats.includes(id) ? LexState.cats.filter(x => x !== id) : LexState.cats.concat(id); LexState.cur = null; render(); });
}

/* ------------------------------------------------ Router */
function parseHash() {
  const h = location.hash.slice(1) || '/'; const [path, qs] = h.split('?');
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  return { parts: path.split('/').filter(Boolean), q };
}
function render() {
  const { parts, q } = parseHash();
  let html, mount = null;
  if (parts[0] === 'k' && chapterOf(+parts[1])) { html = viewChapter(+parts[1]); if (+parts[1] === 0) mount = mountLex; }
  else if (parts[0] === 'lex' && parts[1] === 'karten') { html = viewLexCards(); mount = mountLexCards; }
  else if (parts[0] === 't' && topicOf(parts[1])) { html = viewTopic(parts[1], parts[2]); if (parts[2] === 'ueben') mount = () => mountPractice(parts[1]); else if (parts[1] === 'g-lex') mount = mountLex; }
  else if (parts[0] === 'formeln') { html = viewFormeln(); mount = mountFormeln; }
  else if (parts[0] === 'test' && parts[1] === 'run') { html = viewTestRun(); mount = mountTestRun; }
  else if (parts[0] === 'test' && parts[1] === 'result') html = viewTestResult();
  else if (parts[0] === 'test') { html = viewTestSetup(q); mount = mountTestSetup; }
  else html = viewHome();
  $app.innerHTML = md(html);
  if (mount) mount();
}
document.addEventListener('click', e => {
  const dc = e.target.closest('[data-discard]'); if (dc) { e.preventDefault(); e.stopPropagation(); discardTest(); render(); return; }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); const h = go.dataset.go; if (location.hash === h || (h === '#/' && !location.hash)) render(); else location.hash = h; window.scrollTo(0, 0); return; }
  const mo = e.target.closest('[data-modal]'); if (mo) openModal(mo.dataset.modal);
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => {
  if (!TestState.items.length || TestState.items[0].res) return;
  if (document.hidden) { TestState.elapsed = elapsedMs(); TestState.resumeAt = null; saveTest(); } else TestState.resumeAt = Date.now();
});
Store.load();
render();
