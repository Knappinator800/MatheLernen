<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mathe & Statistik – Lernapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{
  --bg1:#0b1020; --bg2:#141a33;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.24);
  --txt:#eef1ff; --muted:#a7aecb; --dim:#7880a3;
  --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --c1:#8b7bff; --c1b:#5ea0ff;
  --c2:#2dd4bf; --c2b:#4ade80;
  --c3:#fb923c; --c3b:#f472b6;
  --acc:var(--c1); --accb:var(--c1b);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100vh;background:var(--bg1);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{background:radial-gradient(1200px 800px at 10% -10%,#2a2470 0%,transparent 55%),
  radial-gradient(900px 700px at 110% 20%,#0e4c5a 0%,transparent 55%),
  radial-gradient(900px 700px at 40% 120%,#5a2340 0%,transparent 55%),
  linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none}
.blob.a{width:340px;height:340px;background:var(--c1);top:-80px;left:-60px}
.blob.b{width:300px;height:300px;background:var(--c2);top:35%;right:-90px}
.blob.c{width:320px;height:320px;background:var(--c3b);bottom:-120px;left:20%}
#app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 16px 90px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:14px 4px 12px;margin:0 -4px;backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);background:rgba(11,16,32,.55);
  border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
  color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:20px;height:20px}
.ibtn:active{transform:scale(.96)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.hero{margin:22px 2px 16px}
.hero h2{margin:0;font-size:26px;letter-spacing:-.3px}
.hero p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
@media(min-width:700px){.grid.cols{grid-template-columns:repeat(2,1fr)}}
.kcard{padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.kcard:active{transform:scale(.985)}
.kcard .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--accb));box-shadow:0 6px 18px rgba(0,0,0,.3)}
.kcard .ico svg{width:24px;height:24px;color:#fff}
.kcard h3{margin:12px 0 2px;font-size:18px}
.kcard .sub{color:var(--muted);font-size:14px}
.kcard::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;
  background:var(--acc);opacity:.18;filter:blur(30px)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--accb));border-radius:99px}
.k1{--acc:var(--c1);--accb:var(--c1b)} .k2{--acc:var(--c2);--accb:var(--c2b)} .k3{--acc:var(--c3);--accb:var(--c3b)}
.kt{--acc:#e879f9;--accb:#60a5fa} .k0{--acc:#38bdf8;--accb:#a78bfa}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 20px;cursor:pointer}
.flash .front{font-size:22px;font-weight:650}
.flash .back{margin-top:16px;color:#dfe3f7;border-top:1px solid var(--line);padding-top:14px;width:100%}
.flash .hint2{color:var(--dim);font-size:13px;margin-top:14px}
.boxes{display:flex;gap:6px;align-items:flex-end;height:46px}
.boxes div{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acc),var(--accb));min-height:3px;position:relative}
.boxes span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.lexrow{padding:12px 16px}
.lexrow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.lexrow summary::-webkit-details-marker{display:none}
.lexrow .def{margin-top:8px;color:#dfe3f7}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.search{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--txt);border-radius:14px;padding:12px 14px;font:inherit;outline:none}
.search:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.trow:active{transform:scale(.99)}
.trow .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc);min-width:34px}
.trow .t{flex:1}
.trow .t b{display:block;font-weight:600}
.trow .t small{color:var(--muted)}
.ring{width:38px;height:38px;flex:none}
.tabs{display:flex;gap:6px;padding:5px;margin:16px 0;border-radius:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--glass2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.sheet{padding:18px 18px 8px}
.sheet h3{margin:18px 0 8px;font-size:17px;color:var(--acc)}
.sheet h3:first-child{margin-top:0}
.sheet p,.sheet li{color:#dfe3f7}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet .box{border-left:3px solid var(--acc);background:rgba(255,255,255,.05);padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0}
.sheet .ex{border-left-color:var(--warn)}
.sheet .ex b:first-child{color:var(--warn)}
.sheet .tip{border-left-color:var(--ok)}
.fm{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:6px 0}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",serif;font-size:1.08em}
math[display=block]{margin:6px 0}
table.tb{border-collapse:collapse;font-size:14px;margin:8px 0;width:100%;font-variant-numeric:tabular-nums}
table.tb td,table.tb th{border:1px solid var(--line);padding:5px 7px;text-align:center}
table.tb th{background:rgba(255,255,255,.06);font-weight:600}
.scroll{overflow-x:auto}
.task{padding:18px}
.task .meta{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted)}
.chip.acc{color:var(--txt);border-color:var(--acc)}
.q{font-size:16px}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--txt);border-radius:12px;
  padding:12px 13px;font:inherit;font-size:17px;outline:none;font-variant-numeric:tabular-nums}
.inrow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.inrow .unit{color:var(--muted);min-width:18px}
.field.ok input{border-color:var(--ok)} .field.bad input{border-color:var(--bad)} .field.near input{border-color:var(--warn)}
.fb{font-size:14px;margin-top:5px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.near{color:var(--warn)}
.preview{font-size:14px;color:var(--muted);min-height:20px;margin-top:4px;overflow-x:auto}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.mc{display:flex;flex-direction:column;gap:8px}
.mc button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);border-radius:14px;
  padding:12px 14px;font:inherit;cursor:pointer}
.mc button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.mc button.right{border-color:var(--ok);background:rgba(74,222,128,.14)}
.mc button.wrong{border-color:var(--bad);background:rgba(248,113,113,.14)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--glass2);color:var(--txt);padding:12px 18px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.btn.pri{border:0;background:linear-gradient(135deg,var(--acc),var(--accb));color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.btn:active{transform:scale(.97)}
.btn.grow{flex:1;justify-content:center}
.btn svg{width:18px;height:18px}
details.sol{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.sol summary{cursor:pointer;color:var(--acc);font-weight:600;list-style:none}
details.sol summary::-webkit-details-marker{display:none}
details.sol .body{margin-top:8px;color:#dfe3f7}
select.sel{background:rgba(0,0,0,.25);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);padding:9px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.tog.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--acc),var(--accb))}
.sect{padding:16px;margin-top:14px}
.sect h4{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.score{font-size:44px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--acc),var(--accb));-webkit-background-clip:text;background-clip:text;color:transparent}
.res{padding:14px 16px}
.res .head{display:flex;align-items:center;gap:10px;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.near{background:var(--warn)}
.prog{height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:10px 0 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--accb))}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.modal .panel{width:100%;max-width:720px;max-height:85vh;overflow:auto;padding:18px;border-radius:24px 24px 0 0;background:rgba(20,26,51,.92)}
@media(min-width:700px){.modal{align-items:center}.modal .panel{border-radius:24px}}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.q .box{border-left:3px solid var(--acc);background:rgba(255,255,255,.05);padding:10px 12px;border-radius:0 12px 12px 0}

.lexletter{font-size:20px;font-weight:800;color:var(--acc);margin:10px 4px 2px;letter-spacing:.5px}

.pm{flex:none;width:52px;height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);color:var(--txt);font:inherit;font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
.pm:active{transform:scale(.95);background:color-mix(in srgb,var(--acc) 25%,transparent)}
.pm:disabled{opacity:.35}
</style>
</head>

{ id: 'f-elem', ch: 1, nr: '1.1–1.2', title: 'Funktionen & elementare Funktionen', sheet: T`
<h3>Funktion</h3>
<p>Eine Funktion \(f: D \to W\) ordnet <b>jedem</b> \(x \in D\) (Definitionsbereich) <b>genau ein</b> \(y = f(x) \in W\) zu. Der Graph ist die Menge der Punkte \((x, f(x))\).</p>
<h3>Lineare Funktionen</h3>
<p>\(f(x) = a\,x + b\) – Gerade mit Steigung \(a\) und \(y\)-Achsenabschnitt \(b\). Sie ist festgelegt durch einen Punkt und die Steigung oder durch zwei Punkte.</p>
<div class="box"><b>Punkt-Steigungs-Form</b> (Punkt \((x_1,y_1)\), Steigung \(a\)):
\[y = f(x) = a\cdot(x - x_1) + y_1\]
<b>Zwei-Punkte-Form</b> (Punkte \((x_1,y_1)\), \((x_2,y_2)\)):
\[y = f(x) = \frac{y_2 - y_1}{x_2 - x_1}\cdot(x - x_1) + y_1\]</div>
<div class="box ex"><b>Beispiel:</b> Punkte \((2,1)\) und \((-1,4)\): \(f(x) = \frac{4-1}{-1-2}(x-2)+1 = -x + 3\).</div>
<h3>Elementare Funktionen</h3>
<ul>
<li>konstant \(f(x)=c\), linear \(ax+b\), quadratisch \(ax^2+bx+c\) (Parabel)</li>
<li>Polynome (ganzrational) \(a_n x^n + \dots + a_1 x + a_0\), \(a_n \neq 0\): Grad \(n\)</li>
<li>gebrochen rational: Quotient zweier Polynome, z. B. \(\frac{1}{x}\)</li>
<li>Exponentialfunktion \(e^x\), \(a^x\); Logarithmus \(\ln x\) (nur \(x>0\))</li>
<li>Potenz- und Wurzelfunktionen \(x^\alpha\), \(\sqrt{x}\); Betragsfunktion \(|x|\)</li>
</ul>
<h3>Rechenregeln (Formelsammlung)</h3>
\[x^{-y} = \frac{1}{x^y}\quad x^{\frac1y} = \sqrt[y]{x}\quad x^y\cdot x^z = x^{y+z}\quad (x^y)^z = x^{y\cdot z}\quad x^z\cdot y^z = (xy)^z\]
\[\log(x\cdot y) = \log x + \log y \qquad \log\frac{x}{y} = \log x - \log y \qquad \log(x^y) = y\cdot\log x\]
<h3>Transformationen</h3>
<ul><li>\(f(x) + c\): Verschiebung nach oben, \(f(x - c)\): Verschiebung nach rechts</li>
<li>\(c\cdot f(x)\): Streckung in \(y\)-Richtung, \(-f(x)\): Spiegelung an der \(x\)-Achse, \(f(-x)\): an der \(y\)-Achse</li></ul>
<h3>BWL-Anwendung</h3>
<p>Erlös \(E(x) = p\cdot x\), Kosten \(K(x) = K_f + k_v\cdot x\) (Fix- und variable Kosten), Gewinn \(G(x) = E(x) - K(x)\). Lineare Preis-Absatz-Funktion \(p(x) = a - b\,x\).</p>
`},
{ id: 'f-null', ch: 1, nr: '1.3', title: 'Kurvendiskussion: Nullstellen & Polynome', sheet: T`
<h3>Schritte der Kurvendiskussion</h3>
<p>Definitions- und Wertebereich, Schnittpunkte mit den Achsen (\(y\)-Achsenabschnitt \(f(0)\), Nullstellen \(f(x)=0\)), Monotonie, Extrema, Krümmung, Wendepunkte, Verhalten für \(x\to\pm\infty\).</p>
<h3>Quadratische Gleichungen</h3>
<div class="box"><b>p-q-Formel</b> für \(x^2 + p\cdot x + q = 0\):
\[x_{1/2} = -\frac{p}{2} \pm \sqrt{\left(\frac p2\right)^2 - q}\]
reelle Lösungen für \(\left(\frac p2\right)^2 - q \ge 0\).</div>
<div class="box"><b>a-b-c-Formel</b> für \(a\cdot x^2 + b\cdot x + c = 0\), \(a\neq 0\):
\[x_{1/2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}\]
reelle Lösungen für \(b^2 - 4ac \ge 0\).</div>
<div class="box tip">Tipp: Erst durch \(a\) teilen, dann p-q-Formel – oder direkt a-b-c-Formel. Prüfe dein Ergebnis mit dem Satz von Vieta: \(x_1 + x_2 = -p\), \(x_1\cdot x_2 = q\).</div>
<h3>Polynome</h3>
<p>Ein Polynom vom Grad \(n\) hat höchstens \(n\) reelle Nullstellen. Ist \(x_1\) eine Nullstelle, lässt sich der Linearfaktor abspalten:</p>
\[f(x) = (x - x_1)\cdot g(x),\qquad \text{Grad } g = n - 1\]
<p><b>Polynomdivision:</b> \(f(x) : (x - x_1) = g(x)\). Eine erste Nullstelle findet man oft durch Probieren (Teiler des absoluten Glieds \(a_0\)).</p>
<div class="box ex"><b>Beispiel:</b> \(h(x) = x^4 + 5x^3 + 8x^2 + x - 15 = (x-1)(x+3)(x^2+3x+5)\). Der quadratische Faktor hat keine reellen Nullstellen \(\Rightarrow\) Nullstellen \(1\) und \(-3\).</div>
<h3>Anwendung: Gewinnschwelle</h3>
<p>Nullstellen der Gewinnfunktion \(G(x) = E(x) - K(x)\): kleinste positive = <b>Gewinnschwelle</b> (Break-even), größere = <b>Gewinngrenze</b>. Linear: \(x = \frac{K_f}{p - k_v}\).</p>
`},
{ id: 'f-eig', ch: 1, nr: '1.4', title: 'Eigenschaften von Funktionen', sheet: T`
<h3>Stetigkeit</h3>
<p>\(f\) ist stetig in \(x_0\), wenn \(\lim_{x\to x_0} f(x) = f(x_0)\) – anschaulich: Graph ohne Absetzen zeichenbar. Unstetigkeiten: endlicher Sprung, Polstelle (Unendlichkeitsstelle). Polynome, \(e^x\), \(\ln x\), \(\sqrt x\), \(|x|\) sind auf ihrem Definitionsbereich stetig.</p>
<h3>Sätze über stetige Funktionen auf \([a,b]\)</h3>
<ul><li><b>Satz vom Maximum/Minimum:</b> \(f\) nimmt auf \([a,b]\) ein globales Max. und Min. an.</li>
<li><b>Zwischenwertsatz:</b> \(f\) nimmt jeden Wert zwischen \(f(a)\) und \(f(b)\) an. Speziell: \(f(a)\cdot f(b) < 0 \Rightarrow\) Nullstelle in \((a,b)\).</li></ul>
<h3>Monotonie</h3>
<p>\(f\) monoton wachsend: \(x_1 < x_2 \Rightarrow f(x_1) \le f(x_2)\); streng: \(<\). Mit Ableitung: \(f'(x)\ge 0 \Leftrightarrow\) monoton wachsend, \(f'(x) > 0 \Rightarrow\) streng monoton wachsend.</p>
<h3>Beschränktheit</h3>
<p>\(f\) nach oben beschränkt, wenn es \(S\) gibt mit \(f(x)\le S\) für alle \(x\in D\) (analog nach unten).</p>
<h3>Konvexität / Konkavität</h3>
<p>Konvex: Verbindungsstrecke zweier Graphenpunkte liegt <b>oberhalb</b> des Graphen (Linkskrümmung). Konkav: unterhalb (Rechtskrümmung).</p>
\[f''(x)\ge 0 \Leftrightarrow f \text{ konvex}\qquad f''(x)\le 0 \Leftrightarrow f \text{ konkav}\]
<h3>Globale und lokale Extrema</h3>
<p>Globales Maximum: \(f(x_0)\ge f(x)\) für alle \(x\in D\). Lokales Maximum: gilt nur in einem offenen Intervall um \(x_0\).</p>
<h3>Umkehrfunktion</h3>
<p>Ist \(f\) streng monoton, existiert \(f^{-1}\): Gleichung \(y = f(x)\) nach \(x\) auflösen, dann Variablen tauschen. Graph: Spiegelung an der Winkelhalbierenden.</p>
<div class="box ex"><b>Beispiel:</b> Preis-Absatz-Funktion \(p(x) = 100 - 2x\) \(\Rightarrow\) Nachfragefunktion \(x(p) = 50 - \frac{p}{2}\) (Menge in Abhängigkeit vom Preis).</div>
\[\left(f^{-1}\right)'(x) = \frac{1}{f'\left(f^{-1}(x)\right)}\]
`},
{ id: 'f-rf', ch: 1, nr: '1.5', title: 'Regula falsi', sheet: T`
<h3>Idee</h3>
<p>Numerisches Verfahren, um Nullstellen zu finden, wenn \(f(x)=0\) nicht analytisch lösbar ist. Grundlage: Zwischenwertsatz.</p>
<div class="box"><ul style="margin:0">
<li>\(f\) stetig auf \(I\), \(a, b \in I\) mit \(f(a)\cdot f(b) < 0\) \(\Rightarrow\) Nullstelle zwischen \(a\) und \(b\).</li>
<li>Schnittpunkt der Sekante durch \((a, f(a))\) und \((b, f(b))\) mit der \(x\)-Achse:
\[x_1 = \frac{a\,f(b) - b\,f(a)}{f(b) - f(a)}\]</li>
<li>\(f(x_1)\) berechnen. <b>Vorzeichentest:</b> den Punkt ersetzen, dessen Funktionswert dasselbe Vorzeichen wie \(f(x_1)\) hat.</li>
<li>Wiederholen, bis \(f(x_n)\) nahe genug bei \(0\) ist.</li></ul></div>
<div class="box ex"><b>Beispiel (Skript):</b> \(f(x) = x^3 - 3x - 6\), \(f(2) = -4\), \(f(3) = 12\).
\[x_1 = \frac{2\cdot 12 - 3\cdot(-4)}{12 - (-4)} = 2{,}25\]
\(f(2{,}25) \approx -1{,}35938 < 0\) – gleiches Vorzeichen wie \(f(a_0)\), also \(a_1 = 2{,}25\), \(b_1 = 3\).
\[x_2 = \frac{2{,}25\cdot 12 - 3\cdot(-1{,}35938)}{12 + 1{,}35938} = 2{,}32632\]
Grenzwert: \(x \approx 2{,}35530\).</div>
<div class="box tip">Merke: Es wird immer der Punkt ersetzt, der auf <b>derselben Seite</b> der Nullstelle liegt wie \(x_n\). So bleibt die Nullstelle eingeschlossen.</div>
`},
{ id: 'f-abl', ch: 1, nr: '1.6', title: 'Ableitungen & Ableitungsregeln', sheet: T`
<h3>Differenzen- und Differentialquotient</h3>
\[\frac{\Delta f}{\Delta x} = \frac{f(x_0 + \Delta x) - f(x_0)}{\Delta x}\qquad f'(x_0) = \lim_{\Delta x\to 0}\frac{f(x_0+\Delta x) - f(x_0)}{\Delta x}\]
<p>\(f'(x_0)\) = Steigung der Tangente in \(x_0\). Differenzierbar \(\Rightarrow\) stetig (nicht umgekehrt: \(|x|\) in \(0\)).</p>
<h3>Ableitungen elementarer Funktionen</h3>
<div class="scroll"><table class="tb"><tr><th>\(f(x)\)</th><th>\(f'(x)\)</th><th>\(f(x)\)</th><th>\(f'(x)\)</th></tr>
<tr><td>\(c\)</td><td>\(0\)</td><td>\(x^\alpha\)</td><td>\(\alpha\,x^{\alpha-1}\)</td></tr>
<tr><td>\(ax+b\)</td><td>\(a\)</td><td>\(\ln|x|\)</td><td>\(\frac1x\)</td></tr>
<tr><td>\(x^n\)</td><td>\(n\,x^{n-1}\)</td><td>\(\log_a|x|\)</td><td>\(\frac{1}{x\cdot\ln a}\)</td></tr>
<tr><td>\(\frac{1}{x^n}\)</td><td>\(-\frac{n}{x^{n+1}}\)</td><td>\(e^x\)</td><td>\(e^x\)</td></tr>
<tr><td>\(\sqrt x\)</td><td>\(\frac{1}{2\sqrt x}\)</td><td>\(a^x\)</td><td>\(a^x\cdot\ln a\)</td></tr></table></div>
<h3>Ableitungsregeln</h3>
<div class="box">
<b>Linearität:</b> \([f + g]' = f' + g'\), \([c\cdot f]' = c\cdot f'\)<br>
<b>Produktregel:</b> \([f\cdot g]' = f'\,g + f\,g'\)<br>
<b>Quotientenregel:</b> \(\left[\frac fg\right]' = \frac{f'\,g - f\,g'}{g^2}\), speziell \(\left[\frac1g\right]' = -\frac{g'}{g^2}\)<br>
<b>Kettenregel:</b> \([f(g(x))]' = f'(g(x))\cdot g'(x)\) – „äußere mal innere Ableitung“</div>
<div class="box ex"><b>Beispiele:</b>
\[\left(x^2 e^{3x}\right)' = 2x\,e^{3x} + 3x^2 e^{3x}\qquad \left((2x+1)^5\right)' = 5(2x+1)^4\cdot 2\qquad \left(\ln(x^2+1)\right)' = \frac{2x}{x^2+1}\]</div>
<h3>Höhere Ableitungen</h3>
<p>\(f''\) ist die Ableitung von \(f'\), \(f'''\) die von \(f''\) usw. \(f'\) beschreibt die Steigung, \(f''\) die Krümmung.</p>
<h3>Ökonomisch</h3>
<p>Grenzkosten \(K'(x)\), Grenzerlös \(E'(x)\), Grenzgewinn \(G'(x)\): Änderung bei einer zusätzlichen Einheit (näherungsweise).</p>
`},
{ id: 'f-ext', ch: 1, nr: '1.6', title: 'Extrema, Wendepunkte & Optimierung', sheet: T`
<h3>Monotonie & Krümmung</h3>
<p>\(f' > 0\): streng wachsend, \(f' < 0\): streng fallend. \(f'' > 0\): streng konvex, \(f'' < 0\): streng konkav.</p>
<h3>Lokale Extrema</h3>
<div class="box"><b>notwendig:</b> \(f'(x_0) = 0\) – \(x_0\) heißt stationäre Stelle<br>
<b>hinreichend:</b> \(f'(x_0) = 0\) und \(f''(x_0) > 0 \Rightarrow\) lokales <b>Minimum</b><br>
\(\phantom{hinreichend:}\) \(f'(x_0) = 0\) und \(f''(x_0) < 0 \Rightarrow\) lokales <b>Maximum</b></div>
<h3>Wendepunkte</h3>
<div class="box"><b>notwendig:</b> \(f''(x_0) = 0\)<br>
<b>hinreichend:</b> \(f''(x_0) = 0\) und \(f'''(x_0) \neq 0\)<br>
\(f'''(x_0) > 0\): Übergang Rechts- auf Linkskrümmung (konkav/konvex), \(f'''(x_0) < 0\): Links- auf Rechtskrümmung (konvex/konkav)</div>
<p>Globale Extrema: lokale Extrema mit den Randwerten bzw. dem Verhalten für \(x\to\pm\infty\) vergleichen.</p>
<div class="box ex"><b>Beispiel (Skript):</b> \(f(x) = x^3 - 3x^2 + 4\): \(f'(x) = 3x^2 - 6x = 3x(x-2)\), stationär bei \(0\) und \(2\). \(f''(x) = 6x - 6\): \(f''(0) = -6 < 0\) \(\Rightarrow\) Max. bei \(0\), \(f''(2) = 6 > 0\) \(\Rightarrow\) Min. bei \(2\). Wendestelle: \(f''(x) = 0 \Rightarrow x = 1\), \(f'''(1)=6\neq 0\).</div>
<h3>Gewinnoptimierung</h3>
<p>\(G(x) = E(x) - K(x)\), mit \(E(x) = p(x)\cdot x\). Optimum: \(G'(x) = 0 \Leftrightarrow E'(x) = K'(x)\) (Grenzerlös = Grenzkosten) und \(G''(x) < 0\).</p>
<div class="box ex"><b>Beispiel:</b> \(p(x) = 100 - 2x\), \(K(x) = 200 + 20x\). \(G(x) = 80x - 2x^2 - 200\), \(G'(x) = 80 - 4x = 0 \Rightarrow x^* = 20\), \(p(20) = 60\), \(G(20) = 600\).</div>
`},

{ id: 'z-meth', ch: 2, nr: '2.1', title: 'Methoden der Zinsberechnung', sheet: T`
<h3>Grundidee</h3>
<p>Kapital \(K_0\) wird über \(t\) Jahre zum Zinssatz \(r\) (p.a.) angelegt. Endkapital:</p>
\[K_t = ZF\cdot K_0\qquad K_0 = DF\cdot K_t,\quad DF = \frac{1}{ZF}\]
<div class="scroll"><table class="tb"><tr><th>Methode</th><th>Zinsfaktor \(ZF\)</th></tr>
<tr><td>einfach</td><td>\(1 + r\,t\)</td></tr>
<tr><td>exponentiell</td><td>\((1+r)^t\)</td></tr>
<tr><td>unterjährig exp.</td><td>\(\left(1+\frac rm\right)^{m t}\)</td></tr>
<tr><td>stetig</td><td>\(e^{r t}\)</td></tr></table></div>
<p>\(m\) = Anzahl der Zinsperioden p.a. (halbjährlich \(m=2\), quartalsweise \(4\), monatlich \(12\)).</p>
<div class="box ex"><b>Beispiel (Formelsammlung):</b> \(K_0 = 4000\,€\), \(r = 3\,\%\), \(t = 5\), exponentiell: \(K_5 = 1{,}03^5\cdot 4000\,€ = 4637{,}10\,€\).</div>
<h3>Auflösen nach \(K_0\), \(r\), \(t\)</h3>
<div class="box"><b>einfach:</b> \(r = \frac1t\left(\frac{K_t}{K_0} - 1\right)\), \(t = \frac1r\left(\frac{K_t}{K_0} - 1\right)\)<br>
<b>exponentiell:</b> \(r = \sqrt[t]{\frac{K_t}{K_0}} - 1\), \(t = \frac{\ln(K_t/K_0)}{\ln(1+r)}\)<br>
<b>stetig:</b> \(r = \frac{\ln(K_t/K_0)}{t}\), \(t = \frac{\ln(K_t/K_0)}{r}\)</div>
<h3>Anwendungsbereiche</h3>
<ul><li>einfach: unterjährige Anlagen (Geldmarkt), Laufzeit \(t\) = Tage/Basis (z. B. act/360)</li>
<li>exponentiell: Standard bei Laufzeiten über ein Jahr (Zinseszins)</li>
<li>unterjährig: mehrere Zinsgutschriften pro Jahr (Tagesgeld, Sparkonto)</li>
<li>stetig: Grenzfall \(m\to\infty\); Theorie, Derivatebewertung</li></ul>
<div class="box tip">Prozent immer als Dezimalzahl einsetzen: \(3\,\% = 0{,}03\).</div>
`},
{ id: 'z-trans', ch: 2, nr: '2.1', title: 'Transformation von Zinssätzen', sheet: T`
<h3>Prinzip</h3>
<p>Zinssätze verschiedener Methoden werden vergleichbar, indem man die <b>Zinsfaktoren gleichsetzt</b>. Ziel ist meist der Effektivzinssatz \(r_{\text{exp}}\) (exponentiell, jährlich).</p>
<div class="box"><b>Effektivzinssatz (Formelsammlung):</b>
\[r_{\text{exp}} = e^{r_{\text{stet}}} - 1\qquad r_{\text{exp}} = \left(1 + \frac{r_{\text{unt exp}}}{m}\right)^m - 1\qquad r_{\text{exp}} = (1 + r_{\text{einf}}\,t)^{\frac1t} - 1\]</div>
<div class="box"><b>Rückrichtung:</b>
\[r_{\text{stet}} = \ln(1 + r_{\text{exp}})\qquad r_{\text{unt exp}} = m\cdot(1+r_{\text{exp}})^{\frac1m} - m\qquad r_{\text{einf}} = \frac{(1+r_{\text{exp}})^t - 1}{t}\]</div>
<div class="box ex"><b>Beispiel:</b> Tagesgeld \(4\,\%\) p.a., monatliche Gutschrift (\(m = 12\)):
\[r_{\text{exp}} = \left(1 + \frac{0{,}04}{12}\right)^{12} - 1 \approx 4{,}07\,\%\]
Halbjährlich gleichwertig zu \(r_{\text{exp}} = 5\,\%\): \(r_{\text{unt exp}} = 2\sqrt{1{,}05} - 2 = 4{,}94\,\%\).</div>
<div class="box tip">Je häufiger verzinst wird, desto kleiner darf der nominelle Zinssatz sein: \(r_{\text{stet}} < r_{\text{unt exp}} < r_{\text{exp}}\) bei gleichem Ertrag.</div>
`},
{ id: 'z-bw', ch: 2, nr: '2.2', title: 'Barwert & Nettobarwert', sheet: T`
<h3>Barwert</h3>
<p>Summe der auf heute diskontierten zukünftigen Zahlungen \(Z_i\):</p>
\[B = D_1 Z_1 + D_2 Z_2 + \dots + D_n Z_n = \sum_{i=1}^n D_i\cdot Z_i\]
<p>Exponentiell mit Opportunitätszinssatz \(r\): \(D_i = \frac{1}{(1+r)^{t_i}}\).</p>
<h3>Nettobarwert</h3>
\[B_{\text{net}} = B - A\]
<p>\(A\) = Aufwand/Preis am Bewertungstag. <b>Entscheidung:</b> \(B_{\text{net}} > 0\) durchführen, \(B_{\text{net}} < 0\) meiden.</p>
<h3>Kuponanleihe</h3>
<p>Jährlicher Kupon \(c\) (in % vom Nennwert) bis zur Fälligkeit \(n\), dann Rückzahlung \(100\,\%\):</p>
\[B = \frac{c}{1+r} + \frac{c}{(1+r)^2} + \dots + \frac{c + 100}{(1+r)^n}\]
<div class="box tip">Kupon \(>\) Marktzins \(\Rightarrow\) Barwert über 100 (über pari); Kupon \(<\) Marktzins \(\Rightarrow\) unter 100.</div>
<h3>Dynamische Investitionsrechnung</h3>
<p>Investition mit Anschaffungsauszahlung \(A\) und Rückflüssen \(Z_1, \dots, Z_n\): Kapitalwert = \(B_{\text{net}}\).</p>
<div class="box ex"><b>Beispiel:</b> Maschine \(200\) TEUR, Rückflüsse \(80, 90, 70\) TEUR, \(r = 5\,\%\):
\[B = \frac{80}{1{,}05} + \frac{90}{1{,}05^2} + \frac{70}{1{,}05^3} \approx 218{,}29\qquad B_{\text{net}} \approx 18{,}29 > 0\]</div>
`},
{ id: 'z-rente', ch: 2, nr: '2.2', title: 'Renten & ewige Renten', sheet: T`
<h3>Rentenbarwert und -endwert</h3>
<p>Periodische Zahlungen der Höhe \(Z\) über \(n\) Jahre:</p>
\[B = BWF\cdot Z\qquad E = EWF\cdot Z\]
<div class="scroll"><table class="tb"><tr><th></th><th>\(BWF\)</th><th>\(EWF\)</th></tr>
<tr><td>nachschüssig, jährlich</td><td>\(\frac{(1+r)^n - 1}{r(1+r)^n}\)</td><td>\(\frac{(1+r)^n - 1}{r}\)</td></tr>
<tr><td>nachschüssig, \(m\) pro Jahr</td><td>\(\frac{\left(1+\frac rm\right)^{mn} - 1}{\frac rm\left(1+\frac rm\right)^{mn}}\)</td><td>\(\frac{\left(1+\frac rm\right)^{mn} - 1}{\frac rm}\)</td></tr>
<tr><td>vorschüssig, jährlich</td><td>\(\frac{(1+r)^n - 1}{r(1+r)^{n-1}}\)</td><td>\((1+r)\frac{(1+r)^n - 1}{r}\)</td></tr>
<tr><td>vorschüssig, \(m\) pro Jahr</td><td>\(\frac{\left(1+\frac rm\right)^{mn} - 1}{\frac rm\left(1+\frac rm\right)^{mn-1}}\)</td><td>\(\left(1+\frac rm\right)\frac{\left(1+\frac rm\right)^{mn} - 1}{\frac rm}\)</td></tr></table></div>
<p>Vorschüssig = Zahlung am Periodenanfang \(\Rightarrow\) Faktor \((1 + r)\) bzw. \((1 + \frac rm)\) gegenüber nachschüssig.</p>
<div class="box ex"><b>Beispiel (Formelsammlung):</b> \(n = 10\), \(Z = 1000\,€\) vorschüssig, \(r = 4\,\%\):
\[E = 1{,}04\cdot\frac{1{,}04^{10} - 1}{0{,}04}\cdot 1000\,€ = 12.486{,}35\,€\]</div>
<h3>Annuitätendarlehen</h3>
<p>Kreditbetrag = Barwert der Annuitäten: \(Z = \frac{B}{BWF}\). Jede Annuität = Zins + Tilgung; der Tilgungsanteil steigt.</p>
<h3>Ewige Rente</h3>
\[B = \frac{Z}{r}\qquad\text{mit Wachstum } g < r:\quad B = \frac{Z}{r - g}\]
<p>(jährlich nachschüssig, \(Z\) = erste Zahlung). Einen Endwert gibt es nicht.</p>
<div class="box ex"><b>Beispiel:</b> \(Z = 10.000\), \(r = 4\,\%\): \(B = 250.000\).</div>
`},
{ id: 'z-eff', ch: 2, nr: '2.3', title: 'Effektivverzinsung & Rendite', sheet: T`
<h3>Definition</h3>
<p>Ein Zinssatz \(r\), für den der Nettobarwert \(B_{\text{net}} = 0\) wird, heißt <b>Effektivzinssatz</b>, <b>Rendite</b> oder <b>interner Zinsfuß</b>:</p>
\[A = \sum_{i=1}^n DF_i\cdot Z_i\]
<h3>Einmalanlage</h3>
\[r = \sqrt[t]{\frac{K_t}{A}} - 1\]
<h3>Zweijährige Anleihe – quadratische Gleichung</h3>
<div class="box ex"><b>Beispiel (Formelsammlung):</b> Kupon \(6\,\%\), Preis \(99\,\%\):
\[99 = \frac{6}{1+r} + \frac{106}{(1+r)^2}\]
Mit \(q = 1 + r\): \(99q^2 - 6q - 106 = 0\) \(\Rightarrow\) \(q = \frac{6 + \sqrt{36 + 4\cdot 99\cdot 106}}{2\cdot 99}\), \(r \approx 6{,}55\,\%\).</div>
<p>Bei längeren Laufzeiten: numerisch (z. B. Regula falsi) oder Näherung.</p>
<h3>Praktikerformel</h3>
\[r \approx \frac{\text{Kupon} + \frac{\text{Rückzahlung} - \text{Preis}}{\text{Restlaufzeit}}}{\text{Preis}}\]
<div class="box ex"><b>Beispiel:</b> obige Anleihe: \(r \approx \frac{6 + \frac{100 - 99}{2}}{99} \approx 6{,}57\,\%\).</div>
<div class="box tip">Preis \(<\) 100 \(\Rightarrow\) Rendite \(>\) Kupon; Preis \(>\) 100 \(\Rightarrow\) Rendite \(<\) Kupon.</div>
`},
{ id: 'z-struk', ch: 2, nr: '2.4', title: 'Zinsstruktur: Spot, Forward, Par Rates', sheet: T`
<h3>Spot Rates (Zero Rates)</h3>
<p>\(r_{0t}\) = Zinssatz für eine heutige Einmalanlage bis \(t\). Die Spot Rates als Funktion von \(t\) bilden die <b>Zinsstruktur</b>. Barwert: jede Zahlung mit „ihrer“ Spot Rate abzinsen:</p>
\[B = \sum_{t} \frac{Z_t}{(1 + r_{0t})^t}\]
<h3>Forward Rates</h3>
<p>\(r_{t't}\) = heute vereinbarter Zinssatz für eine Anlage von \(t'\) bis \(t\) (\(t' < t\)):</p>
\[(1 + r_{0t})^t = (1 + r_{0t'})^{t'}\cdot(1 + r_{t't})^{t - t'}\ \Rightarrow\ r_{t't} = \left[\frac{(1 + r_{0t})^t}{(1 + r_{0t'})^{t'}}\right]^{\frac{1}{t - t'}} - 1\]
<div class="box ex"><b>Beispiel (Skript):</b> \(r_{01} = 5\,\%\), \(r_{03} = 6\,\%\): \(r_{13} = \sqrt{\frac{1{,}06^3}{1{,}05}} - 1 = 6{,}50\,\%\).</div>
<h3>Par Rates \(k_n\) (Renditestruktur)</h3>
<p>Anlagezinssatz einer zu pari (Preis 100) notierenden Anlage mit jährlicher Zinszahlung. <b>Bootstrapping</b> – Zero Rates rekursiv:</p>
\[r_{01} = k_1,\qquad 1 = \sum_{i=1}^{n-1}\frac{k_n}{(1 + r_{0i})^i} + \frac{1 + k_n}{(1 + r_{0n})^n}\]
\[r_{0n} = \sqrt[n]{\frac{1 + k_n}{1 - k_n\sum_{i=1}^{n-1}(1 + r_{0i})^{-i}}} - 1\]
<div class="box ex"><b>Beispiel (Skript):</b> \(k_1 = 4\,\%\), \(k_2 = 4{,}5\,\%\), \(k_3 = 5\,\%\) \(\Rightarrow\) \(r_{01} = 4\,\%\), \(r_{02} = 4{,}51\,\%\), \(r_{03} = 5{,}03\,\%\).</div>
<p><b>Rückrichtung</b> (Par Rate aus Zero Rates):</p>
\[k_n = \frac{1 - (1 + r_{0n})^{-n}}{\sum_{i=1}^n (1 + r_{0i})^{-i}}\]
`},
/* ------------------------------------------------ Kapitel 3 */
{ id: 's-desk', ch: 3, nr: '3.1', title: 'Mittelwert, Varianz, Korrelation', sheet: T`
<h3>Kennzahlen einer Zahlenreihe \(x_1,\dots,x_n\)</h3>
\[\bar x = \frac1n\sum_{i=1}^n x_i\]
\[\sigma_x^2 = \frac1n\sum_{i=1}^n (x_i - \bar x)^2 = \frac1n\sum_{i=1}^n x_i^2 - \bar x^2 = \overline{x^2} - \bar x^2\qquad \sigma_x = \sqrt{\sigma_x^2}\]
<div class="box tip">Im Skript: <b>empirische</b> Varianz mit Faktor \(\frac1n\) (nicht \(\frac1{n-1}\)). Auf dem Taschenrechner also \(\sigma_n\) bzw. \(\sigma x\) verwenden, nicht \(s\).</div>
<h3>Zweidimensionale Reihe \((x_i, y_i)\)</h3>
\[\sigma_{xy} = \frac1n\sum_{i=1}^n (x_i - \bar x)(y_i - \bar y) = \overline{xy} - \bar x\,\bar y\]
\[\rho_{xy} = \frac{\sigma_{xy}}{\sigma_x\cdot\sigma_y},\qquad -1 \le \rho_{xy} \le 1\]
<ul><li>\(\rho_{xy} = 1\) bzw. \(-1\): alle Punkte auf einer Geraden mit positiver bzw. negativer Steigung</li>
<li>\(\rho_{xy} = 0\): kein <b>linearer</b> Zusammenhang (ein nichtlinearer ist möglich)</li></ul>
<div class="box ex"><b>Beispiel:</b> Würfel zehnmal geworfen – Mittelwert \(\bar x\) und \(\sigma_x\) aus den Augenzahlen; bei Aktien: mittlere Rendite = \(\bar x\), Risiko = \(\sigma_x\) (Volatilität).</div>
`},
{ id: 's-pf', ch: 3, nr: '3.2', title: 'Risiko & Diversifikation', sheet: T`
<h3>Portfoliorendite</h3>
<p>Anteil \(w\) in Aktie X, \(1 - w\) in Aktie Y: \(z_i = w\,x_i + (1 - w)\,y_i\).</p>
\[\bar z = w\,\bar x + (1 - w)\,\bar y\]
<h3>Portfoliorisiko</h3>
\[\sigma_z^2 = w^2\sigma_x^2 + (1-w)^2\sigma_y^2 + 2w(1-w)\,\sigma_{xy}\]
\[\phantom{\sigma_z^2} = w^2\sigma_x^2 + (1-w)^2\sigma_y^2 + 2w(1-w)\,\rho_{xy}\,\sigma_x\sigma_y\qquad \sigma_z = \sqrt{\sigma_z^2}\]
<h3>Diversifikation</h3>
<p>Wegen \(\rho_{xy} \le 1\) gilt für \(w\in[0,1]\):</p>
\[\sigma_z \le w\,\sigma_x + (1 - w)\,\sigma_y\]
<p>Das Portfoliorisiko ist höchstens der gewichtete Durchschnitt der Einzelrisiken – Gleichheit nur bei \(\rho_{xy} = 1\). Je kleiner die Korrelation, desto stärker der Diversifikationseffekt. Bei \(\rho_{xy} = -1\) lässt sich das Risiko vollständig eliminieren.</p>
<div class="box ex"><b>Beispiel:</b> \(\bar x = 0{,}5\,\%\), \(\bar y = 0{,}3\,\%\), \(\sigma_x = 3\,\%\), \(\sigma_y = 2\,\%\), \(\rho_{xy} = 0{,}2\), \(w = 0{,}5\):
\[\bar z = 0{,}4\,\%,\quad \sigma_z^2 = 0{,}25\cdot 9 + 0{,}25\cdot 4 + 2\cdot 0{,}25\cdot 0{,}2\cdot 3\cdot 2 = 3{,}85\ (\%^2),\quad \sigma_z \approx 1{,}96\,\%\]</div>
<div class="box tip">In \(\%\) rechnen ist bequem – aber dann ist \(\sigma^2\) in \(\%^2\). Am Ende Wurzel ziehen nicht vergessen.</div>
`},
{ id: 's-reg', ch: 3, nr: '3.3', title: 'Lineare Regression & Beta', sheet: T`
<h3>Regressionsgerade \(y = \alpha + \beta x\)</h3>
<p>Methode der kleinsten Quadrate: \(\alpha, \beta\) so wählen, dass \(\sum (y_i - \alpha - \beta x_i)^2\) minimal wird. Ergebnis:</p>
\[\beta = \beta_{xy} = \frac{\sigma_{xy}}{\sigma_x^2} = \frac{\rho_{xy}\cdot\sigma_y}{\sigma_x}\qquad \alpha = \bar y - \beta\,\bar x\]
<p>Die Gerade geht immer durch den Schwerpunkt \((\bar x, \bar y)\).</p>
<h3>Beta einer Aktie</h3>
<p>\(x\) = Index-/Marktrendite, \(y\) = Aktienrendite. \(\beta\) misst die Sensitivität der Aktie gegenüber dem Markt:</p>
<ul><li>\(\beta > 1\): Aktie schwankt stärker als der Markt</li>
<li>\(0 < \beta < 1\): schwächer als der Markt</li>
<li>\(\beta < 0\): gegenläufig</li></ul>
<div class="box ex"><b>Interpretation:</b> \(\beta = 1{,}2\) – steigt der Index um \(1\,\%\), steigt die Aktie im Mittel um \(1{,}2\,\%\).</div>
<h3>Varianzzerlegung (Single-Index-Modell)</h3>
\[\sigma_y^2 = \beta^2\sigma_x^2 + \sigma_\varepsilon^2\]
<p>systematisches (Markt-)Risiko \(\beta^2\sigma_x^2\) + unsystematisches, diversifizierbares Risiko \(\sigma_\varepsilon^2\). Anteil systematisch: \(\rho_{xy}^2\).</p>
`},
{ id: 's-quant', ch: 3, nr: '3.4', title: 'Quantile & Value at Risk', sheet: T`
<h3>Median</h3>
<p>Geordnete Reihe \(x_{(1)} \le \dots \le x_{(n)}\):</p>
\[\tilde x = x_{\left(\frac{n+1}{2}\right)}\ (n \text{ ungerade})\qquad \tilde x = \tfrac12\left(x_{(n/2)} + x_{(n/2+1)}\right)\ (n \text{ gerade})\]
<h3>p-Quantil \(x_p\)</h3>
<p>Teilt die geordnete Reihe im Verhältnis \(p\) zu \(1 - p\). Regel im Skript:</p>
<div class="box"><ul style="margin:0"><li>\(n\cdot p\) <b>nicht ganzzahlig</b>: aufrunden \(\Rightarrow\) \(x_p = x_{(\lceil np\rceil)}\)</li>
<li>\(n\cdot p\) <b>ganzzahlig</b>: \(x_p = \tfrac12\left(x_{(np)} + x_{(np+1)}\right)\)</li></ul></div>
<div class="box ex"><b>Beispiel (Skript):</b> \(n = 20\). \(20\,\%\)-Quantil: \(20\cdot 0{,}2 = 4\) ganzzahlig \(\Rightarrow\) Mittel aus 4. und 5. Wert. \(12\,\%\)-Quantil: \(20\cdot 0{,}12 = 2{,}4\) \(\Rightarrow\) 3. Wert.</div>
<h3>Value at Risk (Datenreihe)</h3>
<p>Datenreihe von Wertveränderungen \(\Delta V\):</p>
\[\text{VaR}_{1-p} = -\Delta V_p\]
<p>Verlustgrenze, die nur mit relativer Häufigkeit von höchstens \(p\) überschritten wird (Konfidenzniveau \(1 - p\)).</p>
<p>Beschreibt die Reihe Portfoliowerte statt Veränderungen: \(\text{VaR} = \bar x - x_p\).</p>
<div class="box ex"><b>Beispiel (Skript):</b> \(n = 30\), \(\text{VaR}_{95\%}\): \(30\cdot 5\,\% = 1{,}5\) \(\Rightarrow\) 2. Wert, \(\Delta V_{5\%} = -4236\), \(\text{VaR}_{95\%} = 4236\).</div>
`},
{ id: 's-zv', ch: 3, nr: '3.5–3.6', title: 'Zufallsvariablen: E, V, Kovarianz', sheet: T`
<h3>Diskrete Zufallsvariable</h3>
<p>Werte \(x_1, \dots, x_n\) mit Wahrscheinlichkeiten \(P(X = x_i)\), \(\sum P(X = x_i) = 1\).</p>
\[E(X) = \mu_X = \sum_{i=1}^n x_i\cdot P(X = x_i)\qquad E(X^2) = \sum_{i=1}^n x_i^2\cdot P(X = x_i)\]
\[V(X) = \sigma_X^2 = \sum_{i=1}^n (x_i - E(X))^2\cdot P(X = x_i) = E(X^2) - E(X)^2\qquad \sigma_X = \sqrt{V(X)}\]
<div class="box ex"><b>Fairer Würfel:</b> \(E(X) = 3{,}5\), \(E(X^2) = \frac{91}{6}\), \(V(X) = \frac{91}{6} - 3{,}5^2 = \frac{35}{12} \approx 2{,}92\).</div>
<h3>Zwei Zufallsvariablen (Zustände mit \(p_i\))</h3>
\[\text{Cov}(X,Y) = \sigma_{XY} = \sum_{i=1}^n [x_i - E(X)][y_i - E(Y)]\,p_i = E(XY) - E(X)E(Y)\]
\[\rho(X,Y) = \frac{\text{Cov}(X,Y)}{\sqrt{V(X)\cdot V(Y)}}\qquad \beta(X,Y) = \frac{\text{Cov}(X,Y)}{V(X)}\]
<h3>Rechenregeln</h3>
\[E(aX + b) = aE(X) + b\qquad V(aX + b) = a^2V(X)\]
\[E(aX + bY) = aE(X) + bE(Y)\]
\[V(aX + bY) = a^2V(X) + b^2V(Y) + 2ab\,\text{Cov}(X,Y)\]
\[\text{Cov}(aX, bY) = ab\,\text{Cov}(X,Y)\qquad \text{Cov}(X,X) = V(X)\]
<p>Portfolio aus \(n\) Titeln: \(V\left(\sum w_iX_i\right) = \sum_i\sum_j w_iw_j\,\text{Cov}(X_i,X_j)\).</p>
`},
{ id: 's-nv', ch: 3, nr: '3.7', title: 'Normalverteilung', sheet: T`
<h3>Normalverteilung \(N(\mu, \sigma^2)\)</h3>
<p>Stetige Verteilung mit glockenförmiger Dichte, symmetrisch um \(\mu\). Wahrscheinlichkeiten = Flächen unter der Dichte; \(P(X = a) = 0\).</p>
<h3>Standardisieren</h3>
\[Z = \frac{X - \mu}{\sigma}\sim N(0,1)\qquad P(X \le a) = F_{St}\!\left(\frac{a - \mu}{\sigma}\right)\]
<div class="box"><b>Mit der Tabelle \(F_{St}(z)\) (nur \(z \ge 0\) tabelliert):</b><br>
\(P(X \le a) = F_{St}(z)\)<br>
\(P(X \ge a) = 1 - F_{St}(z)\)<br>
\(F_{St}(-z) = 1 - F_{St}(z)\)<br>
\(P(a \le X \le b) = F_{St}(z_b) - F_{St}(z_a)\)</div>
<div class="box tip">\(z\) auf <b>zwei Nachkommastellen</b> runden, dann in der Tabelle ablesen: Zeile = erste Nachkommastelle, Spalte = zweite.</div>
<h3>Symmetrische Schwankungsintervalle</h3>
\[P(\mu - a\sigma \le X \le \mu + a\sigma) = 2F_{St}(a) - 1\]
<p>\(a = 1\): \(68{,}26\,\%\), \(a = 2\): \(95{,}44\,\%\), \(a = 3\): \(99{,}74\,\%\).</p>
<h3>Quantile und VaR</h3>
<p>\(x_p = \mu + a\cdot\sigma\) mit \(F_{St}(a) = p\):</p>
<div class="scroll"><table class="tb"><tr><th>\(p\)</th><td>10 %</td><td>5 %</td><td>2,5 %</td><td>1 %</td><td>0,5 %</td><td>0,1 %</td></tr>
<tr><th>\(a\)</th><td>−1,282</td><td>−1,645</td><td>−1,960</td><td>−2,326</td><td>−2,576</td><td>−3,090</td></tr></table></div>
<p>Für \(90\,\%\), \(95\,\%\), … gleiche Zahlen mit positivem Vorzeichen. Wertveränderung \(\Delta V \sim N(\mu, \sigma^2)\): \(\text{VaR}_{1-p} = -x_p = -(\mu + a\sigma)\).</p>
<div class="box ex"><b>Beispiel (Skript):</b> \(\mu = -294\), \(\sigma = 2375\): \(x_{5\%} = -294 - 1{,}645\cdot 2375 = -4201\), \(\text{VaR}_{95\%} = 4201\).</div>
<p><b>Abweichungen in der Praxis:</b> Renditen zeigen oft höhere Wölbung (Kurtosis, „fat tails“) und Schiefe.</p>
`},
{ id: 's-zgws', ch: 3, nr: '3.8', title: 'Zentraler Grenzwertsatz', sheet: T`
<h3>Aussage</h3>
<p>Die Summe einer großen Anzahl unabhängiger Zufallsvariablen, deren Einzelbeitrag jeweils unbedeutend ist, ist <b>annähernd normalverteilt</b> – auch wenn die einzelnen Variablen selbst nicht normalverteilt sind.</p>
<div class="box"><b>Für unabhängige, identisch verteilte \(X_1,\dots,X_n\)</b> mit \(E(X_i) = \mu\), \(V(X_i) = \sigma^2\):
\[S = \sum_{i=1}^n X_i:\quad E(S) = n\mu,\quad V(S) = n\sigma^2,\quad \sigma_S = \sqrt n\,\sigma\]
\[P(S \le s) \approx F_{St}\!\left(\frac{s - n\mu}{\sqrt n\,\sigma}\right)\]</div>
<div class="box ex"><b>Beispiel:</b> Augensumme von 10 Würfeln: \(E(S) = 35\), \(V(S) = 10\cdot\frac{35}{12} \approx 29{,}17\), \(\sigma_S \approx 5{,}40\). Die Verteilung ist bereits nahezu glockenförmig.</div>
<h3>Binomialverteilung</h3>
<p>Anzahl der Erfolge bei \(n\) unabhängigen Versuchen mit Erfolgswahrscheinlichkeit \(p\) – Summe von \(n\) 0/1-Variablen: \(E = np\), \(V = np(1-p)\). Für großes \(n\) annähernd normalverteilt (bei kleinem \(p\) braucht man ein größeres \(n\)).</p>
<h3>Bedeutung</h3>
<p>Rechtfertigt die Normalverteilungsannahme für Größen, die sich additiv aus vielen kleinen, unabhängigen Zufallseinflüssen zusammensetzen (z. B. Renditen über viele Handelstage).</p>
`}
];

const FORMELN = [
{ id: 'elem', title: 'Elementare Rechenregeln', html: T`
<h3>Rechenregeln für Potenzen, Wurzeln und Logarithmen</h3>
<p>Für reelle Zahlen \(x\), \(y\) und \(z\), für die die jeweiligen Ausdrücke gebildet werden dürfen, gilt:</p>
\[x^{-y} = \frac{1}{x^y}\qquad x^y\cdot x^z = x^{y+z}\qquad \log(x\cdot y) = \log x + \log y\]
\[x^{\frac1y} = \sqrt[y]{x}\qquad x^z\cdot y^z = (xy)^z\qquad \log\left(\frac xy\right) = \log x - \log y\]
\[(x^y)^z = x^{y\cdot z}\qquad \log(x^y) = y\cdot\log x\]
<h3>Lösung quadratischer Gleichungen</h3>
<p><b>p-q-Formel:</b> Die Lösungen \(x_1, x_2\) der quadratischen Gleichung \(x^2 + p\cdot x + q = 0\) sind</p>
\[x_{1/2} = -\frac p2 \pm \sqrt{\left(\frac p2\right)^2 - q}\]
<p>Reelle Lösungen ergeben sich für \(\left(\frac p2\right)^2 - q \ge 0\).</p>
<p><b>a-b-c-Formel:</b> Liegt die Gleichung in der Form \(a\cdot x^2 + b\cdot x + c = 0\) mit \(a \ne 0\) vor, kann sie durch Division durch \(a\) auf die p-q-Form gebracht werden, oder direkt:</p>
\[x_{1/2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}\]
<p>Reelle Lösungen ergeben sich für \(b^2 - 4ac \ge 0\).</p>`},
{ id: 'fin', title: 'Finanzmathematik', html: T`
<h3>Zinsfaktoren</h3>
<p>Ein Kapitalbetrag \(K_0\) wird einmalig über einen Zinszeitraum von \(t\) Jahren zu einem festen Zinssatz \(r\) (p.a.) angelegt. Mit dem Zinsfaktor \(ZF\) ergibt sich das Endkapital</p>
\[K_t = ZF\cdot K_0\]
<div class="scroll"><table class="tb"><tr><th>Zinsberechnungsmethode</th><td>einfach</td><td>exponentiell</td><td>unterjährig exp.</td><td>stetig</td></tr>
<tr><th>Zinsfaktor \(ZF\)</th><td>\(1 + rt\)</td><td>\((1+r)^t\)</td><td>\(\left(1 + \frac rm\right)^{mt}\)</td><td>\(e^{rt}\)</td></tr></table></div>
<p>\(m\) bezeichnet die Anzahl der Zinsperioden p.a. Der Kehrwert \(1/ZF\) heißt Diskontfaktor \(DF\): \(K_0 = DF\cdot K_t\).</p>
<div class="box ex"><b>Beispiel:</b> \(K_0 = 4000\,€\), \(r = 3\,\%\), \(t = 5\), exponentiell: \(K_5 = (1 + 0{,}03)^5\cdot 4000\,€ = 4637{,}10\,€\)</div>
<h3>Effektivzinssatz</h3>
<p>Transformation verschiedener Zinssätze in den Effektivzinssatz \(r_{\text{exp}}\):</p>
\[r_{\text{exp}} = e^{r_{\text{stet}}} - 1\qquad r_{\text{exp}} = \left(1 + \frac{r_{\text{unt exp}}}{m}\right)^m - 1\qquad r_{\text{exp}} = (1 + r_{\text{einf}}\,t)^{\frac1t} - 1\]
<div class="box ex"><b>Beispiel:</b> Tagesgeld \(4\,\%\) p.a., monatliche Gutschrift (\(m = 12\)): \(r_{\text{exp}} = \left(1 + \frac{4\%}{12}\right)^{12} - 1 \approx 4{,}07\,\%\)</div>
<h3>Renditerechnung</h3>
<p>Die Rendite eines Zahlungsstroms \(Z_1, \dots, Z_n\) ist derjenige konstante Zinssatz \(r\), für den der Barwert gerade den tatsächlichen Wert \(A\) (z. B. Kaufpreis) annimmt:</p>
\[A = \sum_{i=1}^n DF_i\cdot Z_i\]
<div class="box ex"><b>Beispiel:</b> zweijährige Anleihe, Kupon \(6\,\%\), Ausgabe zu \(99\,\%\): \(99 = \frac{6}{1+r} + \frac{106}{(1+r)^2}\ \Rightarrow\ r \approx 6{,}55\,\%\)</div>
<p><b>Praktikerformel</b> (ganzjährige Restlaufzeit und Kupontermine):</p>
\[r \approx \frac{\text{Kupon} + \frac{\text{Rückzahlung} - \text{Preis}}{\text{Restlaufzeit}}}{\text{Preis}}\qquad\text{Beispiel: } r \approx \frac{6 + \frac{100 - 99}{2}}{99} \approx 6{,}57\,\%\]
<h3>Rentenbarwert- und Rentenendwertfaktoren</h3>
<p>Über \(n\) Jahre werden periodisch Zahlungen der Höhe \(Z\) geleistet:</p>
\[B = BWF\cdot Z\qquad E = EWF\cdot Z\]
<div class="scroll"><table class="tb"><tr><th></th><th>Barwertfaktor \(BWF\)</th><th>Endwertfaktor \(EWF\)</th></tr>
<tr><th>nachschüssig, jährlich</th><td>\(\frac{(1+r)^n - 1}{r(1+r)^n}\)</td><td>\(\frac{(1+r)^n - 1}{r}\)</td></tr>
<tr><th>nachschüssig, \(m\) Zahlungen p.a.</th><td>\(\frac{\left(1+\frac rm\right)^{m\cdot n} - 1}{\frac rm\left(1+\frac rm\right)^{m\cdot n}}\)</td><td>\(\frac{\left(1+\frac rm\right)^{m\cdot n} - 1}{\frac rm}\)</td></tr>
<tr><th>vorschüssig, jährlich</th><td>\(\frac{(1+r)^n - 1}{r(1+r)^{n-1}}\)</td><td>\((1+r)\frac{(1+r)^n - 1}{r}\)</td></tr>
<tr><th>vorschüssig, \(m\) Zahlungen p.a.</th><td>\(\frac{\left(1+\frac rm\right)^{m\cdot n} - 1}{\frac rm\left(1+\frac rm\right)^{m\cdot n - 1}}\)</td><td>\(\left(1+\frac rm\right)\frac{\left(1+\frac rm\right)^{m\cdot n} - 1}{\frac rm}\)</td></tr></table></div>
<p>\(n\): Laufzeit in Jahren (ganzzahlig); \(r\): Zinssatz p.a. der exponentiellen (Zeilen 1 und 3) bzw. der unterjährig exponentiellen Verzinsung (Zeilen 2 und 4).</p>
<div class="box ex"><b>Beispiel:</b> \(n = 10\), \(Z = 1000\,€\) jährlich vorschüssig, \(r = 4\,\%\): \(E = 1{,}04\cdot\frac{1{,}04^{10} - 1}{0{,}04}\cdot 1000\,€ = 12.486{,}35\,€\)</div>
<p><b>Barwert einer ewigen Rente</b> mit jährlichen nachschüssigen Zahlungen:</p>
\[B = \begin{cases}\dfrac Zr & \text{bei konstanten Zahlungen } Z\\[2mm] \dfrac{Z}{r - g} & \text{bei anfänglicher Zahlung } Z \text{ mit Wachstumsrate } g\ (g < r)\end{cases}\]
<h3>Forward Rates, Zero/Spot Rates und Par Rates</h3>
<p><b>Forward Rate</b> \(r_{t't}\):</p>
\[(1 + r_{0t})^t = (1 + r_{0t'})^{t'}\cdot(1 + r_{t't})^{t - t'}\ \Rightarrow\ r_{t't} = \left[\frac{(1 + r_{0t})^t}{(1 + r_{0t'})^{t'}}\right]^{\frac{1}{t - t'}} - 1\]
<p><b>Zero Rates</b> \(r_{0n}\) rekursiv aus den Anlagezinssätzen (Par Rates) \(k_n\):</p>
\[r_{01} = k_1,\qquad r_{0n} = \sqrt[n]{\frac{1 + k_n}{1 - k_n\sum_{i=1}^{n-1}(1 + r_{0i})^{-i}}} - 1\]
<p><b>Par Rates</b> \(k_n\) aus den Zero Rates:</p>
\[k_n = \frac{1 - (1 + r_{0n})^{-n}}{\sum_{i=1}^n (1 + r_{0i})^{-i}}\]`},
{ id: 'fkt', title: 'Funktionen und Differentialrechnung', html: T`
<h3>Lineare Funktionen</h3>
<div class="scroll"><table class="tb"><tr><th></th><th>gegeben</th><th>Funktionsterm</th></tr>
<tr><th>Punkt-Steigungs-Form</th><td>Punkt \((x_1, y_1)\), Steigung \(a\)</td><td>\(y = f(x) = a\cdot(x - x_1) + y_1\)</td></tr>
<tr><th>Beispiel</th><td>\((2, 5)\), Steigung \(2\)</td><td>\(f(x) = 2(x - 2) + 5 = 2x + 1\)</td></tr>
<tr><th>Zwei-Punkte-Form</th><td>\((x_1, y_1)\), \((x_2, y_2)\)</td><td>\(y = f(x) = \frac{y_2 - y_1}{x_2 - x_1}(x - x_1) + y_1\)</td></tr>
<tr><th>Beispiel</th><td>\((2, 1)\), \((-1, 4)\)</td><td>\(f(x) = \frac{4 - 1}{-1 - 2}(x - 2) + 1 = -x + 3\)</td></tr></table></div>
<h3>Regula Falsi</h3>
<ul><li>Sei \(I\) ein Intervall, \(f: I \to \text{ℝ}\) stetig und \(a, b \in I\) mit \(f(a)\cdot f(b) < 0\).</li>
<li>Dann gibt es nach dem Zwischenwertsatz eine Nullstelle von \(f\) zwischen \(a\) und \(b\).</li>
<li>Schnittpunkt der Geraden durch \((a, f(a))\) und \((b, f(b))\) mit der \(x\)-Achse:
\[x_1 = \frac{a\,f(b) - b\,f(a)}{f(b) - f(a)}\]</li>
<li>Dann \(f(x_1)\) berechnen. Ist der Wert noch nicht nahe genug bei 0, den Punkt durch \((x_1, f(x_1))\) ersetzen, der auf derselben Seite der Nullstelle liegt (Vorzeichentest).</li>
<li>Schritte wiederholen, bis man sich der Nullstelle hinreichend genau angenähert hat.</li></ul>
<h3>Ableitungen elementarer Funktionen</h3>
<div class="scroll"><table class="tb"><tr><th>\(f(x)\)</th><th>\(f'(x)\)</th><th>\(f(x)\)</th><th>\(f'(x)\)</th></tr>
<tr><td>\(c\) (konstant)</td><td>\(0\)</td><td>\(x^\alpha\) \((\alpha \in \text{ℝ}, x > 0)\)</td><td>\(\alpha x^{\alpha - 1}\)</td></tr>
<tr><td>\(ax + b\)</td><td>\(a\)</td><td>\(\ln|x|\) \((x \ne 0)\)</td><td>\(\frac1x\)</td></tr>
<tr><td>\(x^n\) \((n \in \text{ℕ})\)</td><td>\(n x^{n-1}\)</td><td>\(\log_a|x|\) \((x \ne 0)\)</td><td>\(\frac{1}{x\cdot\ln a}\)</td></tr>
<tr><td>\(\frac{1}{x^n}\) \((x \ne 0)\)</td><td>\(-\frac{n}{x^{n+1}}\)</td><td>\(e^x\)</td><td>\(e^x\)</td></tr>
<tr><td>\(\sqrt x\) \((x > 0)\)</td><td>\(\frac{1}{2\sqrt x}\)</td><td>\(a^x\) \((a > 0)\)</td><td>\(a^x\cdot\ln a\)</td></tr></table></div>
<h3>Ableitungsregeln für zusammengesetzte Funktionen</h3>
<div class="scroll"><table class="tb">
<tr><th>Linearität</th><td>\([f(x) + g(x)]' = f'(x) + g'(x)\), \([c\cdot f(x)]' = c\cdot f'(x)\)</td></tr>
<tr><th>Produktregel</th><td>\([f(x)\cdot g(x)]' = f'(x)g(x) + f(x)g'(x)\)</td></tr>
<tr><th>Quotientenregel</th><td>\(\left[\frac{f(x)}{g(x)}\right]' = \frac{f'(x)g(x) - f(x)g'(x)}{g(x)^2}\), \(\left[\frac{1}{g(x)}\right]' = -\frac{g'(x)}{g(x)^2}\)</td></tr>
<tr><th>Kettenregel</th><td>\([f(g(x))]' = f'(g(x))\cdot g'(x)\)</td></tr>
<tr><th>Umkehrfunktion</th><td>\(\left(f^{-1}\right)'(x) = \frac{1}{f'\left(f^{-1}(x)\right)}\)</td></tr></table></div>
<h3>Vorzeichen der zweiten Ableitung vs. Konvexität/Konkavität</h3>
<p>Ist \(f\) auf \([a,b]\) stetig und auf \((a,b)\) zweimal differenzierbar, so gilt:</p>
<ul><li>\(f''(x) \ge 0\) auf \((a,b)\) \(\Leftrightarrow\) \(f\) ist auf \([a,b]\) konvex</li>
<li>\(f''(x) \le 0\) auf \((a,b)\) \(\Leftrightarrow\) \(f\) ist auf \([a,b]\) konkav</li>
<li>\(f''(x) = 0\) auf \((a,b)\) \(\Leftrightarrow\) \(f\) ist auf \([a,b]\) linear</li>
<li>\(f''(x) > 0\) auf \((a,b)\) \(\Rightarrow\) \(f\) ist auf \([a,b]\) streng konvex</li>
<li>\(f''(x) < 0\) auf \((a,b)\) \(\Rightarrow\) \(f\) ist auf \([a,b]\) streng konkav</li></ul>
<h3>Notwendige und hinreichende Bedingungen für lokale Extrema</h3>
<p>\(x_0\) innerer Punkt, \(f\) zweimal differenzierbar:</p>
<div class="box"><b>notwendig:</b> \(f'(x_0) = 0\) (horizontale Tangente), \(x_0\) heißt dann stationäre Stelle.<br>
<b>hinreichend:</b> \(f'(x_0) = 0\) und \(f''(x_0) > 0\) (Konvexität) \(\Rightarrow\) lokales Minimum<br>
oder \(f'(x_0) = 0\) und \(f''(x_0) < 0\) (Konkavität) \(\Rightarrow\) lokales Maximum</div>
<h3>Notwendige und hinreichende Bedingungen für Wendepunkte</h3>
<p>\(x_0\) innerer Punkt, \(f\) dreimal differenzierbar:</p>
<div class="box"><b>notwendig:</b> \(f''(x_0) = 0\) (keine Krümmung), \(x_0\) ist dann Stelle eines Flachpunkts.<br>
<b>hinreichend:</b> \(f''(x_0) = 0\) und \(f'''(x_0) > 0\) (Übergang Rechts- auf Linkskrümmung) \(\Rightarrow\) Wendestelle (konkav/konvex)<br>
oder \(f''(x_0) = 0\) und \(f'''(x_0) < 0\) (Übergang Links- auf Rechtskrümmung) \(\Rightarrow\) Wendestelle (konvex/konkav)</div>`},
{ id: 'stat', title: 'Statistik', html: T`
<h3>Maßzahlen der beschreibenden Statistik</h3>
<p>Zu einer Zahlenreihe \(x_1, \dots, x_n\):</p>
\[\bar x = \frac1n\sum_{i=1}^n x_i\qquad \sigma_x^2 = \frac1n\sum_{i=1}^n (x_i - \bar x)^2 = \frac1n\sum_{i=1}^n x_i^2 - \bar x^2 = \overline{x^2} - \bar x^2\qquad \sigma_x = \sqrt{\sigma_x^2}\]
<p>Zu einer zweidimensionalen Zahlenreihe \((x_1, y_1), \dots, (x_n, y_n)\):</p>
\[\sigma_{xy} = \frac1n\sum_{i=1}^n (x_i - \bar x)(y_i - \bar y) = \frac1n\sum_{i=1}^n x_iy_i - \bar x\bar y = \overline{xy} - \bar x\bar y\]
\[\rho_{xy} = \frac{\sigma_{xy}}{\sigma_x\cdot\sigma_y}\qquad \beta_{xy} = \frac{\sigma_{xy}}{\sigma_x^2} = \frac{\rho_{xy}\cdot\sigma_y}{\sigma_x}\]
<p>Lineare Regressionsgerade \(y = \alpha + \beta x\) mit \(\beta = \beta_{xy}\), \(\alpha = \bar y - \beta\bar x\).</p>
<h3>Gewichtete Zahlenreihen (z. B. Portfolio)</h3>
<p>Für \(z_i = w x_i + (1 - w) y_i\), \(i = 1, \dots, n\), mit Gewicht \(w \in \text{ℝ}\):</p>
\[\bar z = w\bar x + (1 - w)\bar y\]
\[\sigma_z^2 = w^2\sigma_x^2 + (1 - w)^2\sigma_y^2 + 2w(1 - w)\sigma_{xy} = w^2\sigma_x^2 + (1 - w)^2\sigma_y^2 + 2w(1 - w)\rho_{xy}\sigma_x\sigma_y\qquad \sigma_z = \sqrt{\sigma_z^2}\]
<h3>Verteilungskennzahlen von Zufallsvariablen</h3>
<p>Diskret verteilte Zufallsvariable \(X\) mit Werten \(x_1, \dots, x_n\) und Wahrscheinlichkeiten \(P(X = x_i)\):</p>
\[E(X) = \mu_X = \sum_{i=1}^n x_i\cdot P(X = x_i)\qquad E(X^2) = \sum_{i=1}^n x_i^2\cdot P(X = x_i)\]
\[V(X) = \sigma_X^2 = \sum_{i=1}^n (x_i - E(X))^2\cdot P(X = x_i) = E(X^2) - E(X)^2\qquad \sigma_X = \sqrt{V(X)}\]
<p>Zwei diskrete Zufallsvariablen \(X, Y\) mit Zuständen \((x_i, y_i)\) und Wahrscheinlichkeiten \(p_i\):</p>
\[\text{Cov}(X,Y) = \sigma_{XY} = \sum_{i=1}^n [x_i - E(X)]\cdot[y_i - E(Y)]\cdot p_i = \sum_{i=1}^n x_iy_ip_i - E(X)E(Y) = E(XY) - E(X)E(Y)\]
\[\rho(X,Y) = \frac{\text{Cov}(X,Y)}{\sqrt{V(X)\cdot V(Y)}}\qquad \beta(X,Y) = \frac{\text{Cov}(X,Y)}{V(X)}\]
<h3>Rechenregeln für Erwartungswerte, Varianzen und Kovarianzen</h3>
\[E(aX + b) = aE(X) + b\qquad V(aX + b) = a^2V(X)\]
\[E(aX + bY) = aE(X) + bE(Y)\]
\[V(aX + bY) = a^2V(X) + b^2V(Y) + 2ab\,\text{Cov}(X,Y) = a^2V(X) + b^2V(Y) + 2ab\,\rho(X,Y)\sqrt{V(X)V(Y)}\]
\[\text{Cov}(aX, bY) = ab\,\text{Cov}(X,Y)\quad \text{Cov}(X,Y) = \text{Cov}(Y,X)\quad \text{Cov}(X,X) = V(X)\quad \text{Cov}(X + Y, Z) = \text{Cov}(X,Z) + \text{Cov}(Y,Z)\]
<p>Gewichtete Summe \(\sum_{i=1}^n w_iX_i\):</p>
\[E\left(\sum_{i=1}^n w_iX_i\right) = \sum_{i=1}^n w_iE(X_i)\]
\[V\left(\sum_{i=1}^n w_iX_i\right) = \sum_{i=1}^n\sum_{j=1}^n w_iw_j\,\text{Cov}(X_i, X_j) = \sum_{i=1}^n w_i^2V(X_i) + 2\sum_{i=1}^n\sum_{j=i+1}^n w_iw_j\,\text{Cov}(X_i, X_j)\]`},

<div id="fsttab"></div>`}

"use strict";
/* ============ Aufgaben-Generatoren ============
   Feld-Typen:
   num : {label, ans, dec, unit}   unit '%' => Eingabe in Prozent
   expr: {label, fn, v, tex}       Term-Eingabe, Prüfung durch Einsetzen
   mc  : {label, opts, ans}        Multiple Choice                         */

const GENS = [];
const G = (id, topic, title, f) => GENS.push({ id, topic, title, f });
const num = (label, ans, dec = 2, unit = '') => ({ type: 'num', label, ans, dec, unit });
const ex = (label, fn, texAns, v = 'x') => ({ type: 'expr', label, fn, tex: texAns, v });
const mc = (label, right, wrong) => { const opts = shuffle([right, ...wrong]); return { type: 'mc', label, opts, ans: opts.indexOf(right) }; };
/* Verständnisfragen-Bank: [Frage, richtig, [falsch...]] */
/* Verständnisfragen: Bank pro Thema, bereits gestellte Fragen kommen erst später wieder */
const MCBANK = {};
const RECENT = {};
function pickFresh(key, n) {
  const r = RECENT[key] || [], all = [...Array(n).keys()], cand = all.filter(i => !r.includes(i));
  const i = pick(cand.length ? cand : all); RECENT[key] = r.concat(i).slice(-Math.max(1, Math.floor(n * 0.75))); return i;
}
const MCQ = (id, topic, title, bank) => { MCBANK[id] = bank; const g = { id, topic, title, mcq: true, f: () => { const b = MCBANK[id]; const [q, r, w] = b[pickFresh(id, b.length)]; return { q, fields: [mc('', r, w)], sol: '' }; } }; GENS.push(g); };
const MCADD = (id, items) => MCBANK[id].push(...items);

/* ==================================================== Kapitel 1 */
G('lin2p', 'f-elem', 'Gerade durch zwei Punkte', () => {
  let a, x1, x2, y1, b;
  do { a = pick([-3, -2, -1, -0.5, 0.5, 1, 2, 3, 4]); b = R(-6, 8); x1 = R(-4, 3); x2 = x1 + pick([2, 4]); } while (!b);
  y1 = a * x1 + b; const y2 = a * x2 + b;
  return {
    q: T`Bestimme die lineare Funktion \(f\), deren Graph durch die Punkte \((${ntc(x1)},\ ${ntc(y1)})\) und \((${ntc(x2)},\ ${ntc(y2)})\) geht.`,
    fields: [ex(T`\(f(x) =\)`, x => a * x + b, polyTeX([b, a]))],
    sol: T`Zwei-Punkte-Form:
\[f(x) = \frac{${ntc(y2)} - ${par(y1)}}{${ntc(x2)} - ${par(x1)}}\cdot(${minus('x', x1)}) + ${par(y1)} = ${ntc(a)}\cdot(${minus('x', x1)}) ${plusTerm(y1)}\]
\[f(x) = ${polyTeX([b, a])}\]`
  };
});

\(x_1 = ${ntc(r1)}\), \(x_2 = ${ntc(r2)}\). Probe (Vieta): \(x_1 + x_2 = ${ntc(r1 + r2)} = -p\), \(x_1x_2 = ${ntc(q)} = q\).`

G('rf', 'f-rf', 'Regula falsi – zwei Schritte', () => {
  let p, q, a, f;
  for (;;) { p = pick([-4, -3, -2, 1, 2, 3]); q = R(-9, 9); f = x => x ** 3 + p * x + q; a = R(-3, 2); if (f(a) * f(a + 1) < 0 && Math.abs(f(a)) > 0.5 && Math.abs(f(a + 1)) > 0.5) break; }
  let A = a, B = a + 1;
  const x1 = (A * f(B) - B * f(A)) / (f(B) - f(A));
  const s1 = Math.sign(f(x1)) === Math.sign(f(A)) ? 'a' : 'b';
  let A2 = A, B2 = B; if (s1 === 'a') A2 = x1; else B2 = x1;
  const x2 = (A2 * f(B2) - B2 * f(A2)) / (f(B2) - f(A2));
  const c = [q, p, 0, 1];
  return {
    q: T`Gegeben \(f(x) = ${polyTeX(c)}\) mit Startwerten \(a_0 = ${a}\), \(b_0 = ${a + 1}\). Berechne die ersten beiden Näherungen der Regula falsi (4 Nachkommastellen).`,
    fields: [num(T`\(x_1 =\)`, x1, 4), num(T`\(x_2 =\)`, x2, 4)],
    sol: T`\(f(a_0) = f(${a}) = ${ntc(f(A))}\), \(f(b_0) = f(${a + 1}) = ${ntc(f(B))}\) – Vorzeichenwechsel ✓
\[x_1 = \frac{a_0 f(b_0) - b_0 f(a_0)}{f(b_0) - f(a_0)} = \frac{${par(A)}\cdot ${par(f(B))} - ${par(B)}\cdot ${par(f(A))}}{${par(f(B))} - ${par(f(A))}} = ${nt(x1, 5)}\]
\(f(x_1) \approx ${nt(f(x1), 5)}\) hat dasselbe Vorzeichen wie \(f(${s1 === 'a' ? 'a_0' : 'b_0'})\) \(\Rightarrow\) ${s1 === 'a' ? T`\(a_1 = x_1\), \(b_1 = b_0\)` : T`\(b_1 = x_1\), \(a_1 = a_0\)`}.
\[x_2 = \frac{a_1 f(b_1) - b_1 f(a_1)}{f(b_1) - f(a_1)} = ${nt(x2, 5)}\]`
  };
});

G('drules', 'f-abl', 'Ableitungsregeln (Wert an einer Stelle)', () => {
  const type = pick(['prod', 'chain', 'quot', 'ln', 'sqrt', 'expchain']);
  let f, fd, fT, fdT, x0, rule;
  if (type === 'prod') {
    const a = R(1, 3), n = R(1, 2), k = pick([-1, 1, 2, 0.5]); x0 = pick([0, 1, -1, 2]);
    fT = T`${a === 1 ? '' : a}x^{${n}}\,e^{${ntc(k)}x}`; f = x => a * x ** n * Math.exp(k * x);
    fd = x => a * Math.exp(k * x) * (n * x ** (n - 1) + k * x ** n);
    fdT = T`${a === 1 ? '' : a + T`\cdot`}\left(${n === 1 ? '' : n}x^{${n - 1}}\,e^{${ntc(k)}x} + ${ntc(k)}\,x^{${n}}\,e^{${ntc(k)}x}\right)`; rule = 'Produktregel';
  } else if (type === 'chain') {
    const b = pick([2, 3, -1, -2]), c = R(-3, 4), n = R(3, 5); x0 = R(-1, 2);
    fT = T`(${polyTeX([c, b])})^{${n}}`; f = x => (b * x + c) ** n; fd = x => n * b * (b * x + c) ** (n - 1);
    fdT = T`${n}\,(${polyTeX([c, b])})^{${n - 1}}\cdot ${par(b)}`; rule = 'Kettenregel (äußere · innere Ableitung)';
  } else if (type === 'quot') {
    let a, b, c, d; do { a = R(1, 5); b = R(-4, 4); c = R(1, 3); d = R(-3, 5); x0 = R(0, 3); } while (a * d - b * c === 0 || c * x0 + d === 0);
    fT = T`\frac{${polyTeX([b, a])}}{${polyTeX([d, c])}}`; f = x => (a * x + b) / (c * x + d); fd = x => (a * d - b * c) / (c * x + d) ** 2;
    fdT = T`\frac{${a}(${polyTeX([d, c])}) - (${polyTeX([b, a])})\cdot ${c}}{(${polyTeX([d, c])})^2} = \frac{${a * d - b * c}}{(${polyTeX([d, c])})^2}`; rule = 'Quotientenregel';
  } else if (type === 'ln') {
    const a = R(1, 4), b = R(1, 9); x0 = R(1, 3);
    fT = T`\ln(${polyTeX([b, 0, a])})`; f = x => Math.log(a * x * x + b); fd = x => 2 * a * x / (a * x * x + b);
    fdT = T`\frac{1}{${polyTeX([b, 0, a])}}\cdot ${2 * a}x`; rule = 'Kettenregel mit \\((\\ln u)\' = \\frac{u\'}{u}\\)';
  } else if (type === 'sqrt') {
    let a, b; do { a = R(1, 5); x0 = R(1, 4); b = pick([1, 4, 9, 16, 25, 36]) - a * x0; } while (b < -10);
    fT = T`\sqrt{${polyTeX([b, a])}}`; f = x => Math.sqrt(a * x + b); fd = x => a / (2 * Math.sqrt(a * x + b));
    fdT = T`\frac{1}{2\sqrt{${polyTeX([b, a])}}}\cdot ${a}`; rule = 'Kettenregel mit \\((\\sqrt u)\' = \\frac{u\'}{2\\sqrt u}\\)';
  } else {
    const a = pick([0.5, 1, -0.5]), b = R(-2, 2), c = R(1, 4); x0 = pick([0, 1, -1]);
    fT = T`${c === 1 ? '' : c}\,e^{${polyTeX([0, b, a])}}`; f = x => c * Math.exp(a * x * x + b * x); fd = x => c * Math.exp(a * x * x + b * x) * (2 * a * x + b);
    fdT = T`${c === 1 ? '' : c}\,e^{${polyTeX([0, b, a])}}\cdot(${polyTeX([b, 2 * a])})`; rule = 'Kettenregel mit \\((e^u)\' = e^u\\cdot u\'\\)';
  }
  return {
    q: T`Berechne die Ableitung von \[f(x) = ${fT}\] an der Stelle \(x_0 = ${x0}\) (4 Nachkommastellen).`,
    fields: [num(T`\(f'(${x0}) =\)`, fd(x0), 4)],
    sol: T`${rule}:
\[f'(x) = ${fdT}\]
\[f'(${x0}) = ${nt(fd(x0), 4)}\]`
  };
});

    s = T`r_{\text{exp}} = \left(1 + \frac{r_{\text{unt exp}}}{m}\right)^m - 1 = \left(1 + \frac{${ntc(r, 4)}}{${m}}\right)^{${m}} - 1`; }

function ewf(r, n, m = 1, vor = false) { const q = 1 + r / m, N = m * n; return (vor ? q : 1) * (q ** N - 1) / (r / m); }

const meanA = a => sum(a) / a.length;
const varA = a => { const m = meanA(a); return sum(a.map(x => (x - m) ** 2)) / a.length; };
const covA = (a, b) => { const ma = meanA(a), mb = meanA(b); return sum(a.map((x, i) => (x - ma) * (b[i] - mb))) / a.length; };
const rowT = (lab, a) => `<tr><th>${lab}</th>${a.map(x => '<td>' + fmtc(x, 4) + '</td>').join('')}</tr>`;

    fields: [num(T`\(\bar x =\)`, m, 2, '%'), num(T`\(\sigma_x^2 =\)`, v, 2, '%²'), num(T`\(\sigma_x =\)`, Math.sqrt(v), 2, '%')],
    sol: T`\[\bar x = \frac{1}{${n}}(${x.map(ntc).join(' + ')}) = ${nt(m, 4)}\]
\[\sigma_x^2 = \frac{1}{${n}}\sum(x_i - \bar x)^2 = \overline{x^2} - \bar x^2 = ${nt(meanA(x.map(a => a * a)), 4)} - ${nt(m, 4)}^2 = ${nt(v, 4)}\]

    fields: [num(T`\(\sigma_{xy} =\)`, c, 2, '%²'), num(T`\(\rho_{xy} =\)`, rho, 4)],

function quantile(sorted, p) { const n = sorted.length, np = rnd(n * p, 9); if (Math.abs(np - Math.round(np)) < 1e-9) { const k = Math.round(np); return { v: (sorted[k - 1] + sorted[k]) / 2, txt: T`\(n\cdot p = ${ntc(np)}\) ganzzahlig \(\Rightarrow\) \(x_p = \tfrac12(x_{(${k})} + x_{(${k + 1})}) = \tfrac12(${ntc(sorted[k - 1])} + ${ntc(sorted[k])})\)` }; } const k = Math.ceil(np); return { v: sorted[k - 1], txt: T`\(n\cdot p = ${ntc(np)}\) nicht ganzzahlig \(\Rightarrow\) aufrunden: \(x_p = x_{(${k})}\)` }; }

    q: T`Die Jahresrendite \(R\) einer Aktie ist normalverteilt mit \(\mu = ${mu}\,\%\) und \(\sigma = ${s}\,\%\). Wie groß ist die Wahrscheinlichkeit, dass die Rendite ${q} beträgt?`, table: true,

G('nullgerade', 'f-elem', 'Achsenschnittpunkte einer Geraden', () => {

  return {

    sol: T`\(f(0) = ${ntc(b)}\). Nullstelle: \(${polyTeX([b, a])} = 0 \Leftrightarrow x = \frac{${ntc(-b)}}{${ntc(a)}} = ${ntc(x0)}\).`

    fields: [num(T`\(x_S =\)`, xs, 2), num(T`\(y_S =\)`, ys, 2)],
    sol: T`\(f(x) = g(x)\): \(${polyTeX([b1, a1])} = ${polyTeX([b2, a2])} \Leftrightarrow ${ntc(a1 - a2)}x = ${ntc(b2 - b1)} \Leftrightarrow x = ${ntc(xs)}\). Einsetzen: \(y = f(${ntc(xs)}) = ${ntc(ys)}\).`

G('diskr', 'f-null', 'Anzahl der Nullstellen (Diskriminante)', () => {
  const k = R(0, 2); let p, q;
  if (k === 2) { const r1 = R(-6, 2), r2 = r1 + R(1, 6); p = -(r1 + r2); q = r1 * r2; }
  else if (k === 1) { const r = R(-6, 6); p = -2 * r; q = r * r; }
  else { p = R(-6, 6) * 2; q = (p / 2) ** 2 + R(1, 9); }
  const D = (p / 2) ** 2 - q;
  return {
    q: T`Wie viele reelle Nullstellen hat \(f(x) = ${polyTeX([q, p, 1])}\)?`,
    fields: [mc('', ['keine', 'genau eine', 'zwei'][k], ['keine', 'genau eine', 'zwei', 'drei'].filter((_, i) => i !== k))],
    sol: T`\(\left(\frac p2\right)^2 - q = ${ntc((p / 2) ** 2)} - ${par(q)} = ${ntc(D)}\) – ${D > 0 ? 'positiv: zwei Nullstellen' : D === 0 ? 'null: eine (doppelte) Nullstelle' : 'negativ: keine reelle Nullstelle'}.`
  };

G('rfexp', 'f-rf', 'Regula falsi bei Exponential-/Log-Funktion', () => {
  const v = pick(['exp', 'ln']); let f, fT, a, b;
  if (v === 'exp') { const c = R(3, 12); f = x => Math.exp(x) + x - c; fT = T`e^x + x - ${c}`; a = Math.floor(solve(f, -5, 5)); }
  else { const c = R(2, 6); f = x => Math.log(x) + x - c; fT = T`\ln x + x - ${c}`; a = Math.max(1, Math.floor(solve(f, 0.01, 10))); }
  b = a + 1; const x1 = (a * f(b) - b * f(a)) / (f(b) - f(a));
  return {
    q: T`Berechne für \(f(x) = ${fT}\) mit \(a = ${a}\), \(b = ${b}\) den ersten Schritt der Regula falsi (4 Nachkommastellen).`,

    sol: T`\(f(${a}) = ${fx(f(a))}\), \(f(${b}) = ${fx(f(b))}\)

});

G('dexpr', 'f-abl', 'Ableitung als Term angeben', () => {
  const t = pick(['chain', 'ln', 'exp', 'prod', 'quot', 'pow']);
  let fT, fn, dT, rule;
  if (t === 'chain') { const a = R(2, 4), b = R(-5, 5), n = R(2, 5); fT = T`(${polyTeX([b, a])})^{${n}}`; fn = x => n * a * (a * x + b) ** (n - 1); dT = T`${n * a}(${polyTeX([b, a])})^{${n - 1}}`; rule = 'Kettenregel'; }
  else if (t === 'ln') { const a = R(2, 6), b = R(1, 9); fT = T`\ln(${polyTeX([b, a])})`; fn = x => a / (a * x + b); dT = T`\frac{${a}}{${polyTeX([b, a])}}`; rule = 'Kettenregel mit (ln u)′ = u′/u'; }
  else if (t === 'exp') { const k = pick([2, 3, -1, -2, 0.5]), c = R(1, 5); fT = T`${c === 1 ? '' : c}e^{${ntc(k)}x}`; fn = x => c * k * Math.exp(k * x); dT = T`${ntc(c * k)}e^{${ntc(k)}x}`; rule = 'Kettenregel'; }
  else if (t === 'prod') { const n = R(1, 3); fT = T`x^{${n}}\ln x`; fn = x => n * x ** (n - 1) * Math.log(x) + x ** (n - 1); dT = T`${n === 1 ? '' : n}x^{${n - 1}}\ln x + x^{${n - 1}}`; rule = 'Produktregel'; }
  else if (t === 'quot') { const a = R(1, 5); fT = T`\frac{x}{x + ${a}}`; fn = x => a / (x + a) ** 2; dT = T`\frac{${a}}{(x + ${a})^2}`; rule = 'Quotientenregel'; }
  else { const a = R(2, 9), n = R(2, 4); fT = T`\frac{${a}}{x^{${n}}}`; fn = x => -a * n / x ** (n + 1); dT = T`-\frac{${a * n}}{x^{${n + 1}}}`; rule = T`Regel für \(\frac1{x^n}\)`; }
  return {
    q: T`Bestimme \(f'(x)\) für \[f(x) = ${fT}\]`,
    fields: [ex(T`\(f'(x) =\)`, fn, dT)],
    sol: T`${rule}: \[f'(x) = ${dT}\]`
  };
});

G('gerade_anw', 'f-abl', 'Grenzerlös & Grenzgewinn', () => {

/* ==================================================== 1.6 Extrema & Optimierung */
G('extquad', 'f-ext', 'Extremum einer quadratischen Funktion', () => {
  const a = pick([-3, -2, -1, 1, 2, 0.5]), xs = R(-6, 10), ys = R(-20, 30), c = [a * xs * xs + ys, -2 * a * xs, a];
  return {
    q: T`Bestimme Lage und Art des Extremums von \(f(x) = ${polyTeX(c)}\).`,
    fields: [num(T`\(x =\)`, xs, 2), num(T`\(f(x) =\)`, ys, 2), mc('Art', a > 0 ? 'Minimum' : 'Maximum', [a > 0 ? 'Maximum' : 'Minimum', 'Wendepunkt'])],
    sol: T`\(f'(x) = ${polyTeX([c[1], 2 * a])} = 0\Rightarrow x = ${xs}\). \(f''(x) = ${ntc(2 * a)} ${a > 0 ? '> 0 \\Rightarrow' : '< 0 \\Rightarrow'}\) ${a > 0 ? 'Minimum' : 'Maximum'}, \(f(${xs}) = ${ys}\).`
  };
});
G('stueckmin', 'f-ext', 'Minimum der Stückkosten', () => {
  const a = pick([0.5, 1, 2, 4, 5]), xs = R(2, 30) * 2, c = a * xs * xs, b = R(5, 40);
  return {
    q: T`Kostenfunktion \(K(x) = ${ntc(a)}x^2 + ${b}x + ${ntc(c)}\). Bei welcher Menge sind die Stückkosten \(k(x) = \frac{K(x)}{x}\) minimal, und wie hoch sind sie dort?`,
    fields: [num(T`\(x^* =\)`, xs, 2), num(T`\(k(x^*) =\)`, a * xs + b + c / xs, 2)],
    sol: T`\(k(x) = ${ntc(a)}x + ${b} + \frac{${ntc(c)}}{x}\), \(k'(x) = ${ntc(a)} - \frac{${ntc(c)}}{x^2} = 0 \Rightarrow x^2 = ${ntc(c / a)}\Rightarrow x^* = ${xs}\). \(k''(x) = \frac{${ntc(2 * c)}}{x^3} > 0\) ⇒ Minimum. \(k(${xs}) = ${nt(a * xs + b + c / xs)}\).`
  };
});
G('erloesmax', 'f-ext', 'Erlösmaximum', () => {
  const b = pick([0.5, 1, 2, 4]), xs = R(5, 50), a = 2 * b * xs;
  return {
    q: T`Preis-Absatz-Funktion \(p(x) = ${ntc(a)} - ${ntc(b)}x\). Bei welcher Menge ist der Erlös maximal? Wie hoch ist der maximale Erlös?`,
    fields: [num(T`\(x^* =\)`, xs, 2), num(T`\(E(x^*) =\)`, a * xs - b * xs * xs, 2)],
    sol: T`\(E(x) = ${ntc(a)}x - ${ntc(b)}x^2\), \(E'(x) = ${ntc(a)} - ${ntc(2 * b)}x = 0\Rightarrow x^* = ${xs}\). \(E(${xs}) = ${ntc(a * xs - b * xs * xs)}\) (Preis dort: \(${ntc(a - b * xs)}\)).`
  };
});
G('wendepkt', 'f-ext', 'Wendepunkt (Koordinaten)', () => {
  let a, w; do { a = pick([1, -1, 2, -2]); w = R(-4, 4); } while (false);
  const b = -3 * a * w, c = [R(-6, 6), R(-9, 9), b, a], y = polyEval(c, w);
  return {
    q: T`Bestimme den Wendepunkt von \(f(x) = ${polyTeX(c)}\).`,
    fields: [num(T`\(x_W =\)`, w, 2), num(T`\(f(x_W) =\)`, y, 2)],
    sol: T`\(f''(x) = ${polyTeX([2 * b, 6 * a])} = 0\Rightarrow x_W = ${w}\), \(f'''(x) = ${6 * a}\ne 0\) ✓. \(f(${w}) = ${ntc(y)}\).`
  };
});
G('globcubic', 'f-ext', 'Globales Maximum auf einem Intervall', () => {
  let a, s1, s2, b, c; do { a = pick([1, -1]); s1 = R(-3, 1); s2 = s1 + 2; b = -3 * a * (s1 + s2) / 2; c = 3 * a * s1 * s2; } while (b % 1);
  const coef = [R(-5, 5), c, b, a], lo = s1 - R(1, 2), hi = s2 + R(1, 2);
  const cand = [lo, s1, s2, hi].map(x => [x, polyEval(coef, x)]), best = cand.reduce((m, p) => p[1] > m[1] ? p : m);
  return {
    q: T`Bestimme das globale Maximum von \(f(x) = ${polyTeX(coef)}\) auf dem Intervall \([${lo},\ ${hi}]\) (Stelle und Wert).`,
    fields: [num(T`\(x =\)`, best[0], 2), num(T`\(f(x) =\)`, best[1], 2)],
    sol: T`Stationäre Stellen: \(f'(x) = ${polyTeX(polyDer(coef))} = 0\Rightarrow x = ${s1},\ ${s2}\). Vergleich mit den Rändern: ${cand.map(p => T`\(f(${p[0]}) = ${ntc(p[1])}\)`).join(', ')}. Größter Wert: \(f(${best[0]}) = ${ntc(best[1])}\).`
  };
});
G('monobereich', 'f-ext', 'Monotoniebereiche (kubisch)', () => {
  let a, s1, s2, b, c; do { a = pick([1, -1, 2]); s1 = R(-4, 2); s2 = s1 + pick([2, 4]); b = -3 * a * (s1 + s2) / 2; c = 3 * a * s1 * s2; } while (b % 1);
  const coef = [R(-5, 5), c, b, a];
  const r = a > 0 ? T`streng fallend auf \([${s1},\ ${s2}]\), sonst wachsend` : T`streng wachsend auf \([${s1},\ ${s2}]\), sonst fallend`;
  const w = a > 0 ? T`streng wachsend auf \([${s1},\ ${s2}]\), sonst fallend` : T`streng fallend auf \([${s1},\ ${s2}]\), sonst wachsend`;
  return {
    q: T`Wie verhält sich \(f(x) = ${polyTeX(coef)}\) bezüglich Monotonie?`,
    fields: [mc('', r, [w, 'überall streng wachsend', T`streng fallend für \(x < 0\), wachsend für \(x > 0\)`])],
    sol: T`\(f'(x) = ${ntc(3 * a)}(${minus('x', s1)})(${minus('x', s2)})\). Zwischen den Nullstellen ist \(f' ${a > 0 ? '< 0' : '> 0'}\).`
  };
});
G('gewinnkubisch', 'f-ext', 'Gewinnmaximum mit kubischen Kosten', () => {
  const p = R(40, 120), a = R(1, 4) / 10, b = R(2, 9), c = R(10, 40), Kf = R(100, 600);
  const G = x => p * x - (a * x ** 3 - b * x ** 2 + c * x + Kf);
  const A = 3 * a, B = -2 * b, C = c - p, xs = (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
  return {
    q: T`Ein Unternehmen verkauft zum festen Preis \(p = ${p}\). Kosten: \(K(x) = ${polyTeX([Kf, c, -b, a])}\). Bestimme die gewinnmaximale Menge (2 Nachkommastellen) und den Gewinn.`,
    fields: [num(T`\(x^* =\)`, xs, 2), num(T`\(G(x^*) =\)`, G(xs), 2)],
    sol: T`\(G'(x) = ${p} - K'(x) = ${polyTeX([p - c, 2 * b, -3 * a])} = 0\). a-b-c-Formel (positive Lösung mit \(G'' < 0\)): \(x^* = ${nt(xs)}\), \(G(x^*) = ${nt(G(xs))}\).`
  };
});

/* ==================================================== 2.1 Zinsberechnung */
G('zinsentage', 'z-meth', 'Zinsen bei einfacher Verzinsung (Tage)', () => {
  const K0 = R(5, 100) * 1000, r = R(5, 50) / 1000, d = R(20, 300), basis = pick([360, 365]);
  const t = d / basis, Z = K0 * r * t;
  return {
    q: T`\(${eur(K0, 0)}\) werden für \(${d}\) Tage zu \(${ptc(r)}\) p.a. einfach verzinst (act/${basis}). Wie hoch sind die Zinsen?`,
    fields: [num('Zinsen', Z, 2, '€')],
    sol: T`\(t = \frac{${d}}{${basis}}\). Zinsen \(= r\cdot t\cdot K_0 = ${ntc(r, 4)}\cdot\frac{${d}}{${basis}}\cdot ${nt(K0, 0)} = ${eur(Z)}\)`
  };
});
G('wechselzins', 'z-meth', 'Wechselnde Zinssätze', () => {
  const K0 = R(4, 40) * 500, r1 = R(10, 40) / 1000, r2 = R(10, 60) / 1000, n1 = R(1, 4), n2 = R(1, 5);
  const Kt = K0 * (1 + r1) ** n1 * (1 + r2) ** n2, rm = (Kt / K0) ** (1 / (n1 + n2)) - 1;
  return {
    q: T`\(K_0 = ${eur(K0, 0)}\) wird ${n1} Jahre zu \(${ptc(r1)}\) und anschließend ${n2} Jahre zu \(${ptc(r2)}\) exponentiell verzinst. Bestimme \(K_t\) und den durchschnittlichen Zinssatz p.a.`,
    fields: [num(T`\(K_t =\)`, Kt, 2, '€'), num(T`\(\bar r =\)`, rm * 100, 2, '%')],
    sol: T`\(K_t = ${nt(K0, 0)}\cdot ${ntc(1 + r1, 4)}^{${n1}}\cdot ${ntc(1 + r2, 4)}^{${n2}} = ${eur(Kt)}\). Durchschnitt (geometrisch): \(\bar r = \sqrt[${n1 + n2}]{\frac{K_t}{K_0}} - 1 = ${pt(rm)}\).`
  };
});
G('methvergl', 'z-meth', 'Methoden vergleichen', () => {
  const K0 = R(4, 40) * 500, r = R(20, 80) / 1000, t = R(2, 10);
  const e = K0 * (1 + r) ** t, s = K0 * Math.exp(r * t), ei = K0 * (1 + r * t);
  return {
    q: T`\(K_0 = ${eur(K0, 0)}\), \(r = ${ptc(r)}\), \(t = ${t}\) Jahre. Berechne \(K_t\) bei einfacher, exponentieller und stetiger Verzinsung.`,
    fields: [num('einfach', ei, 2, '€'), num('exponentiell', e, 2, '€'), num('stetig', s, 2, '€')],
    sol: T`\((1 + ${ntc(r, 4)}\cdot ${t})\cdot K_0 = ${eur(ei)}\), \(${ntc(1 + r, 4)}^{${t}}\cdot K_0 = ${eur(e)}\), \(e^{${ntc(r * t, 4)}}\cdot K_0 = ${eur(s)}\). Bei \(t > 1\): einfach < exponentiell < stetig.`
  };
});
G('unterk0', 'z-meth', 'Unterjährige Verzinsung: Anfangskapital', () => {
  const Kt = R(10, 80) * 500, r = R(10, 60) / 1000, m = pick([2, 4, 12]), t = R(2, 8);
  const ZF = (1 + r / m) ** (m * t);
  return {
    q: T`Welcher Betrag muss heute angelegt werden, um nach \(${t}\) Jahren bei \(${ptc(r)}\) p.a. und \(m = ${m}\) Zinsperioden \(${eur(Kt, 0)}\) zu haben?`,
    fields: [num(T`\(K_0 =\)`, Kt / ZF, 2, '€')],
    sol: T`\[K_0 = \frac{K_t}{\left(1 + \frac rm\right)^{mt}} = \frac{${nt(Kt, 0)}}{\left(1 + \frac{${ntc(r, 4)}}{${m}}\right)^{${m * t}}} = ${eur(Kt / ZF)}\]`
  };
});
G('einfachr', 'z-meth', 'Rentabilität kurzfristiger Anlage', () => {
  const A = R(10, 100) * 100, d = R(30, 270), r0 = R(10, 60) / 1000, Kt = rnd(A * (1 + r0 * d / 360), 2), r = (Kt / A - 1) * 360 / d;
  return {
    q: T`Eine Geldmarktanlage über \(${eur(A, 0)}\) zahlt nach \(${d}\) Tagen \(${eur(Kt)}\) zurück. Welcher einfache Zinssatz (act/360) liegt vor?`,
    fields: [num(T`\(r =\)`, r * 100, 2, '%')],
    sol: T`\(r = \frac1t\left(\frac{K_t}{K_0} - 1\right) = \frac{360}{${d}}\left(\frac{${nt(Kt)}}{${nt(A, 0)}} - 1\right) = ${pt(r)}\)`
  };
});
G('zfaktor', 'z-meth', 'Zins- und Diskontfaktor', () => {
  const r = R(10, 80) / 1000, t = R(2, 15), m = pick(['exp', 'stet']);
  const ZF = m === 'exp' ? (1 + r) ** t : Math.exp(r * t);
  return {
    q: T`Berechne Zinsfaktor \(ZF\) und Diskontfaktor \(DF\) bei ${m === 'exp' ? 'exponentieller' : 'stetiger'} Verzinsung mit \(r = ${ptc(r)}\) über \(t = ${t}\) Jahre (6 Nachkommastellen).`,
    fields: [num(T`\(ZF =\)`, ZF, 6), num(T`\(DF =\)`, 1 / ZF, 6)],
    sol: T`\(ZF = ${m === 'exp' ? T`${ntc(1 + r, 4)}^{${t}}` : T`e^{${ntc(r, 4)}\cdot ${t}}`} = ${nt(ZF, 6)}\), \(DF = \frac{1}{ZF} = ${nt(1 / ZF, 6)}\).`
  };
});

G('stet2unt', 'z-trans', 'Stetig ↔ unterjährig', () => {
  const r = R(10, 80) / 1000, m = pick([2, 4, 12]), v = Math.random() < 0.5;
  const ans = v ? m * Math.exp(r / m) - m : m * Math.log(1 + r / m);
  return {
    q: v ? T`Welcher Zinssatz \(r_{\text{unt exp}}\) mit \(m = ${m}\) entspricht \(r_{\text{stet}} = ${ptc(r)}\)?` : T`Welcher stetige Zinssatz entspricht \(r_{\text{unt exp}} = ${ptc(r)}\) bei \(m = ${m}\)?`,
    fields: [num(v ? T`\(r_{\text{unt exp}} =\)` : T`\(r_{\text{stet}} =\)`, ans * 100, 2, '%')],
    sol: v ? T`\[r_{\text{unt exp}} = m\cdot e^{\frac{r_{\text{stet}}}{m}} - m = ${m}\cdot e^{\frac{${ntc(r, 4)}}{${m}}} - ${m} = ${pt(ans, 4)}\]` : T`\[r_{\text{stet}} = m\cdot\ln\left(1 + \frac{r_{\text{unt exp}}}{m}\right) = ${m}\ln\left(1 + \frac{${ntc(r, 4)}}{${m}}\right) = ${pt(ans, 4)}\]`
  };
});

G('restschuld', 'z-rente', 'Restschuld eines Annuitätendarlehens', () => {

    q: T`Darlehen \(${eur(B, 0)}\), \(r = ${ptc(r)}\), Laufzeit ${n} Jahre, jährliche nachschüssige Annuität. Wie hoch sind Annuität und Restschuld nach ${k} Jahren?`,
    fields: [num(T`\(Z =\)`, Z, 2, '€'), num(T`Restschuld nach ${k} J.`, Rk, 2, '€')],
    sol: T`\(Z = \frac{B}{BWF} = ${eur(Z)}\). Restschuld = Barwert der restlichen \(${n - k}\) Annuitäten: \(Z\cdot\frac{${ntc(1 + r, 4)}^{${n - k}} - 1}{${ntc(r, 4)}\cdot ${ntc(1 + r, 4)}^{${n - k}}} = ${eur(Rk)}\)`
  };
});
G('rentelaufzeit', 'z-rente', 'Laufzeit einer Rente', () => {
  const r = R(20, 60) / 1000, n0 = R(5, 30), Z = R(5, 40) * 100, B = rnd(Z * bwf(r, n0), 0);
  const n = -Math.log(1 - r * B / Z) / Math.log(1 + r);
  return {
    q: T`Ein Kapital von \(${eur(B, 0)}\) soll bei \(${ptc(r)}\) jährlich nachschüssig \(${eur(Z, 0)}\) auszahlen. Wie viele Jahre reicht es?`,
    fields: [num(T`\(n =\)`, n, 2, 'Jahre')],
    sol: T`\(B = Z\cdot\frac{(1+r)^n - 1}{r(1+r)^n}\Rightarrow (1+r)^{-n} = 1 - \frac{rB}{Z}\Rightarrow n = -\frac{\ln(1 - ${ntc(r * B / Z, 6)})}{\ln ${ntc(1 + r, 4)}} = ${nt(n)}\)`
  };
});

/* ==================================================== 2.3 Effektivverzinsung */
G('irr2', 'z-eff', 'Interner Zinsfuß einer Investition', () => {
  const A = R(80, 150) * 10, Z1 = R(30, 80) * 10, Z2 = R(40, 100) * 10;
  if (Z1 + Z2 <= A) return GEN_BY_ID.irr2.f();
  const q = (Z1 + Math.sqrt(Z1 * Z1 + 4 * A * Z2)) / (2 * A), r = q - 1;
  return {
    q: T`Eine Investition kostet \(${nt(A, 0)}\,€\) und bringt nach einem Jahr \(${nt(Z1, 0)}\,€\) und nach zwei Jahren \(${nt(Z2, 0)}\,€\). Bestimme den internen Zinsfuß.`,
    fields: [num(T`\(r =\)`, r * 100, 2, '%')],
    sol: T`\(0 = -${nt(A, 0)} + \frac{${nt(Z1, 0)}}{q} + \frac{${nt(Z2, 0)}}{q^2}\) mit \(q = 1 + r\) ⇒ \(${nt(A, 0)}q^2 - ${nt(Z1, 0)}q - ${nt(Z2, 0)} = 0\)
\[q = \frac{${nt(Z1, 0)} + \sqrt{${nt(Z1, 0)}^2 + 4\cdot ${nt(A, 0)}\cdot ${nt(Z2, 0)}}}{2\cdot ${nt(A, 0)}} = ${nt(q, 6)}\Rightarrow r = ${pt(r)}\]`
  };
});

/* gewichtete Auswahl: Aufgabentypen mit Fehlern / wenig Übung häufiger */
const LASTG = [];
function chooseGen(list) {
  const avoid = LASTG.slice(-Math.min(3, Math.max(0, list.length - 2)));
  const cand = list.filter(g => !avoid.includes(g.id)); if (cand.length) list = cand;
  const w = list.map(g => { const s = Store.d.g[g.id]; if (!s || !s.last.length) return 3; return 1 + 3 * (1 - sum(s.last) / s.last.length); });
  let x = Math.random() * sum(w); for (let i = 0; i < list.length; i++) { x -= w[i]; if (x <= 0) return list[i]; } return list[list.length - 1];
}

/* Bewertung: 'ok' | 'near' (Rundungsabweichung) | 'bad' */
function grade(f, a) {
  if (f.type === 'mc') return { st: a === f.ans ? 'ok' : 'bad' };
  if (f.type === 'expr') { if (!a || !a.trim()) return { st: 'bad', msg: 'keine Eingabe' }; const r = checkExpr(a, f.fn, f.v); return { st: r.ok ? 'ok' : 'bad', msg: r.err }; }
  const v = parseNum(a); if (isNaN(v)) return { st: 'bad', msg: a ? 'keine gültige Zahl' : 'keine Eingabe' };
  const diff = Math.abs(v - f.ans), tol = Math.pow(10, -f.dec) * 1.01;
  if (diff <= tol + 1e-9) return { st: 'ok' };
  if (diff <= Math.max(Math.abs(f.ans) * 0.002, 2.5 * tol)) return { st: 'near' };
  return { st: 'bad' };
}
function correctText(f) {
  if (f.type === 'mc') return f.opts[f.ans];
  if (f.type === 'expr') return tex(f.tex);
  return fmt(f.ans, f.dec) + (f.unit ? ' ' + f.unit : '');
}
function showGrading(task, root, res) {

  });
}

function nextPractice(tid) {

    const res = readAnswers(cur, box).map((a, i) => grade(cur.fields[i], a));

function wireTask(root, task) {
  /* ±-Taste: Vorzeichen umschalten, Tastatur bleibt offen */
  root.querySelectorAll('[data-pm]').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.onclick = e => {
      e.preventDefault();
      const inp = root.querySelector('#in' + b.dataset.pm); if (!inp || inp.disabled) return;
      const v = inp.value.trim();
      inp.value = v.startsWith('-') || v.startsWith('−') ? v.slice(1) : '-' + v;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.focus(); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (_) { }
    };
  });
  root.querySelectorAll('[data-mc]').forEach(b => b.onclick = () => {
    const [i] = b.dataset.mc.split(':'); root.querySelectorAll(`[data-mc^="${i}:"]`).forEach(x => x.classList.remove('sel')); b.classList.add('sel');
  });
  task.fields.forEach((f, i) => {
    if (f.type !== 'expr') return;
